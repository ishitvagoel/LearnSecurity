name: content

# Mechanical enforcement of the content quality bar.
#
# Every rule in this repository's quality bar existed on paper before 54 modules
# failed to meet it. Rules that nothing checks decay. See
# content/progress/content-quality-improvement-plan-2026-09-16.md (W0).

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-content:
    name: Lesson and metadata lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pyyaml
      # Runs against scripts/lint_baseline.json, so this fails on NEW or
      # regressed findings only. The baseline shrinks as modules are deepened;
      # it must never grow.
      - name: Lint content
        run: python scripts/lint_content.py
      - name: Baseline must not have grown
        run: |
          python scripts/lint_content.py --update-baseline
          if ! git diff --quiet -- scripts/lint_baseline.json; then
            echo "::error::scripts/lint_baseline.json is stale. Findings were added or removed."
            echo "Run: python scripts/lint_content.py --update-baseline"
            git --no-pager diff --stat -- scripts/lint_baseline.json
            exit 1
          fi

  labs:
    name: Lab matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - name: Vulnerable fails, fixed passes
        run: bash scripts/run_labs.sh

  site:
    name: Site build and key isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run lint
      - run: npm --prefix site run build
      - name: Examiner keys must not be linked from the published export
        # A bare-text grep for "assessment/keys" false-positives on every
        # lesson that correctly tells the reader where keys live (e.g.
        # "Answer keys are not on this site; they live only in
        # content/assessment/keys/1.4.md") -- that sentence is the isolation
        # policy working, not a leak. Modules 1.3 and 1.4 both say this and
        # would trip a bare-text check. The actual risk is a *link* or
        # *embedded content* reaching a learner page, so this checks for an
        # href into the keys tree and for key file content appearing
        # verbatim in the export, not for the path being named in prose.
        run: |
          if grep -rlE 'href="[^"]*assessment/keys' site/out >/dev/null 2>&1; then
            echo "::error::site/out contains a link into content/assessment/keys"
            exit 1
          fi
          leaked=0
          for key in content/assessment/keys/*.md; do
            [ -f "$key" ] || continue
            # A distinctive line from the key (skip the title and blanks) --
            # if it appears verbatim in the export, the key's content leaked,
            # not just its path.
            needle="$(grep -v '^#' "$key" | grep -v '^\s*$' | head -1)"
            [ -n "$needle" ] || continue
            if grep -rlF "$needle" site/out >/dev/null 2>&1; then
              echo "::error::site/out contains content from $key"
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ] && echo "no key links or key content in site/out"
          exit "$leaked"
