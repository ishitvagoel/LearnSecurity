name: content

# Mechanical enforcement of the content quality bar.
#
# Every rule in this repository's quality bar existed on paper before 54 modules
# failed to meet it. Rules that nothing checks decay. See
# content/progress/content-quality-improvement-plan-2026-09-16.md (W0).

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-content:
    name: Lesson and metadata lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pyyaml
      - name: Lint content
        run: |
          if [ -f scripts/lint_content.py ]; then
            python scripts/lint_content.py
          else
            echo "::warning title=W0 not implemented::scripts/lint_content.py is missing. Rules L001-L017 are unenforced. See .cursor/skills/content-lint/."
          fi
      - name: Calibration — reference modules must pass
        run: |
          if [ -f scripts/lint_content.py ]; then
            python scripts/lint_content.py content/modules/1/1.2
            python scripts/lint_content.py content/modules/1/1.3
          fi

  labs:
    name: Lab matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - name: Vulnerable fails, fixed passes
        run: |
          set -u
          if [ -f scripts/run_labs.sh ]; then
            bash scripts/run_labs.sh
            exit $?
          fi
          echo "::warning title=W0 not implemented::scripts/run_labs.sh is missing; using the inline matrix."
          anomalies=0
          for conftest in labs/*/*/conftest.py; do
            lab="$(dirname "$conftest")"
            # Some labs pin their own dependencies; install before asserting, or a
            # missing package reports as a test failure that is not a test failure.
            [ -f "$lab/requirements.txt" ] && python -m pip install -q -r "$lab/requirements.txt"
            # labs/1.1 still takes --claim; it is queued for migration to --impl.
            grep -q '"--impl"' "$conftest" || { echo "skip (legacy entry point): $lab"; continue; }
            if python -m pytest "$lab/tests" --impl vulnerable -q >/dev/null 2>&1; then
              echo "::error file=$lab::vulnerable variant passed; it must fail on the forbidden outcome"
              anomalies=$((anomalies + 1))
            fi
            if ! python -m pytest "$lab/tests" --impl fixed -q >/dev/null 2>&1; then
              echo "::error file=$lab::fixed variant failed; it must pass"
              anomalies=$((anomalies + 1))
            fi
          done
          echo "anomalies: $anomalies"
          [ "$anomalies" -eq 0 ]

  site:
    name: Site build and key isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run lint
      - run: npm --prefix site run build
      - name: Examiner keys must not reach the published export
        run: |
          if grep -rl "assessment/keys" site/out >/dev/null 2>&1; then
            echo "::error::site/out references content/assessment/keys"
            exit 1
          fi
          echo "no key paths in site/out"
