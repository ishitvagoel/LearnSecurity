name: LearnSecurity QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned QA environment
        run: python -m pip install --requirement requirements-dev.lock
      - name: Check repository prerequisites
        run: python scripts/doctor.py --profile repo --strict
      - name: Validate curriculum contracts
        run: python scripts/validate_repo.py --strict
      - name: Run repository regression tests
        run: python -m pytest

  lab-matrix:
    name: Vulnerable/fixed lab matrix
    runs-on: ubuntu-latest
    needs: repository-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned QA environment
        run: python -m pip install --requirement requirements-dev.lock
      - name: Run all local lab contracts
        run: python scripts/run_lab_matrix.py

  changed-module:
    name: Changed-module deep check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: repository-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned QA environment
        run: python -m pip install --requirement requirements-dev.lock
      - name: Run checks for changed lab/module slices
        run: python scripts/run_lab_matrix.py --changed-only --base-ref "origin/${{ github.base_ref }}"

  site:
    name: Site lint and build
    runs-on: ubuntu-latest
    needs: repository-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned QA environment
        run: python -m pip install --requirement requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check site prerequisites
        run: python scripts/doctor.py --profile site --strict
      - name: Install locked site dependencies
        run: npm --prefix site ci
      - name: Lint site
        run: npm --prefix site run lint
      - name: Build site from repository root (standard Turbopack)
        run: npm --prefix site run build
      - name: Clear generated Next.js build cache for fallback
        run: rm -rf site/.next
      - name: Build site from repository root (Webpack fallback)
        run: npm --prefix site run build:webpack
