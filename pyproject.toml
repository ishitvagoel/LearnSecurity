[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "learnsecurity-qa"
version = "0.1.0"
description = "Reproducible QA tooling for the LearnSecurity curriculum repository"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qa = [
  "PyYAML==6.0.3",
  "cryptography==46.0.0",
  "jsonschema==4.25.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
