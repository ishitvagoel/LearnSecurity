    notes: "SSDF 1.1 (SP 800-218) remains the final baseline. SP 800-218 Rev. 1 / SSDF 1.2 is an Initial Public Draft (17 Dec 2025); comment period closed 30 Jan 2026 and is still draft — see nist-sp-800-218-r1-ssdf-1.2. Module 3.3 uses 1.1 only for design-review vocabulary (PW.1 design); architecture guarantees are the DB-role tests, not an SSDF attestation. Modules 9.1–9.5 and 10.1 use 1.1 PW.1 / PW.7 / PW.8 / RV.1 as practice vocabulary, not as Gate 9/10 evidence."
