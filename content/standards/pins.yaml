  - id: w3c-csp3
    source: W3C Content Security Policy Level 3
    version: "Level 3"
    status: draft
    publishedAt: "2026-08-13"
    reviewedAt: "2026-08-23"
    url: "https://www.w3.org/TR/CSP3/"
    role: "Browser-enforced content restrictions; not an application guarantee"
    notes: "W3C Working Draft 13 August 2026. Must be labeled draft. Not a substitute for output encoding or Trusted Types. Module 6.2 treats CSP as a layer after HTML-text encoding (v5.0.0-1.2.1); report-only is not enforcement."
  - id: w3c-trusted-types
