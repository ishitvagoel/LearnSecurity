    version: "WD"
    status: draft
    publishedAt: "2026-06-23"
    reviewedAt: "2026-08-23"
    url: "https://www.w3.org/TR/trusted-types/"
    role: "Typed values at dangerous sinks; layered with CSP"
    notes: "W3C Working Draft 23 June 2026. Label draft. Framework defaults are not Trusted Types. Module 6.2 names Trusted Types as a residual layer, not the HTML-text encoding property."
  - id: owasp-top-10-2025
    source: OWASP Top 10
    version: "2025"
    status: awareness
    publishedAt: "2025"
    reviewedAt: "2026-08-23"
    url: "https://owasp.org/Top10/2025/"
    role: "Risk-awareness and coverage regression only"
    notes: "A10:2025 Mishandling of Exceptional Conditions maps to 2.4 and 6.6 as regression after consume-once / fail-closed, not as the learning order. A03 supply chain is Phase 10. Blueprint lists A05 against 6.1 as regression after the argv-shape cause; do not treat A05 as the syllabus. Module 10.4 maps A02 after the fail-open prod-debug cause; A02 is awareness, not the boot_ok syllabus."
  - id: cwe
    source: MITRE CWE
    version: "Top 25 2025 / family refs"
    status: awareness
    publishedAt: "2025"
    reviewedAt: "2026-08-23"
    url: "https://cwe.mitre.org/top25/archive/2025/2025_cwe_top25.html"
    role: "Implementation-oriented weakness families; not the syllabus order"
    notes: "Use to test whether parser/injection families were missed. Do not organize modules as CWE IDs. Modules 6.1 and 6.2 cite CWE-77/78/89 and CWE-79 as awareness after the cause. Module 6.4 cites CWE-22/434/502 after the path-object cause."
  - id: owasp-api-top-10-2023
    source: OWASP API Security Top 10
    version: "2023"
    status: awareness
    publishedAt: "2023"
    reviewedAt: "2026-09-06"
    url: "https://owasp.org/API-Security/editions/2023/en/0x00-header/"
    role: "API risk-awareness regression only; not the syllabus"
    notes: "Module 3.4 maps API4 and API6 as awareness after the product-cap invariant. Module 6.7 maps them again after the export-quota resource account. Module 4.4 maps API1/API3/API5 as awareness after the object-and-tenant matrix is taught. Module 6.5 maps API7 as awareness after the egress allow-list. Module 7.1 maps API8/API9 after the writable-field allow-list (OpenAPI is inventory). Module 7.2 restates API1/API3/API5 after field grain. Module 7.3 maps API10 after raw-body MAC. Do not treat API1 as the definition of the grant-on-n1 property."
  - id: nist-sp-800-218-ssdf
