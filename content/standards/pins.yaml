# Pinned standards

# Populated by the standards-pin skill. Do not present drafts as final.
# Schema per row: id, source, version, status, publishedAt, reviewedAt, url, role, notes

pins:
  - id: saltzer-schroeder-1975
    source: Saltzer & Schroeder, The Protection of Information in Computer Systems
    version: "1975"
    status: final
    publishedAt: "1975"
    reviewedAt: "2026-08-29"
    url: "https://web.mit.edu/saltzer/www/publications/protection/"
    role: "Timeless protection principles; property vs mechanism"
    notes: "Seminal invited paper (IEEE), not a numbered standard. Live-checked at the canonical MIT text for Module 1.3 on 2026-08-29. Pin status uses 'final' only to mean the 1975 text is the stable canonical source (not a draft). Module metadata labels status as seminal. Module 1.3 teaches economy of mechanism, fail-safe defaults, least common mechanism, and complete mediation as design reasoning rather than compliance requirements."
  - id: nist-csf-2.0
    source: NIST Cybersecurity Framework (CSF) 2.0
    version: "2.0"
    status: final
    publishedAt: "2024-02-26"
    reviewedAt: "2026-08-25"
    url: "https://www.nist.gov/publications/nist-cybersecurity-framework-csf-20"
    role: "Govern, Identify, Protect, Detect, Respond, Recover outcome taxonomy"
    notes: "NIST CSWP 29. CSF states outcomes; it does not prescribe controls. Do not treat CSF Functions as a vulnerability checklist or as proof of security."
  - id: cisa-secure-by-design
    source: CISA Secure by Design
    version: "current-public-guidance"
    status: unverified
    publishedAt: "2023"
    reviewedAt: "2026-08-25"
    url: "https://www.cisa.gov/securebydesign"
    role: "Product ownership, secure defaults, shift burden off customers"
    notes: "Living CISA program page, not a versioned ISO-style standard. The 2026-08-23 review confirmed manufacturer ownership and secure out-of-the-box defaults, but both the canonical fetch and an independent HTTP fetch returned 403 during the 2026-08-25 Module 1.2 revision. Module 3.3 cites it only as unverified manufacturer-ownership guidance; do not infer a new version or treat pledge language as an assurance baseline."
  - id: owasp-asvs-5.0.0
    source: OWASP Application Security Verification Standard
    version: "5.0.0"
    status: final
    publishedAt: "2025-05-30"
    reviewedAt: "2026-08-29"
    url: "https://owasp.org/www-project-application-security-verification-standard/"
    role: "Web/API security requirements and assurance baseline"
    notes: "Project page confirms latest stable 5.0.0 released 30 May 2025. The 2026-08-29 Module 1.3 check used the immutable v5.0.0 tag. 2026-09-06 Modules 2.1–2.4 pinned V1/V2/V3/V4/V12/V14 as listed in those module.yaml files. 2026-09-06 Module 3.1 used V14.1.1, V14.1.2, and V16.2.5. 2026-09-06 Module 3.2 used v5.0.0-15.1.3 and labeled v5.0.0-15.1.5 as Level 3 advanced. 2026-09-06 Module 3.3 used v5.0.0-8.4.1 (Level 2 cross-tenant controls), v5.0.0-8.2.2, v5.0.0-8.3.1, and labeled v5.0.0-15.2.5 as Level 3 advanced (isolation around dangerous functionality). ASVS 5.0 removed a numbered 'do threat modeling' requirement; Appendix D is awareness, not a verification ID. Use exact v5.0.0-<chapter>.<section>.<requirement> identifiers; do not mix ASVS 4.x IDs. Level 3 guidance is labeled advanced and is not an undisclosed baseline. Module 1.1 intentionally does not map ASVS requirements."
  - id: owasp-threat-modeling
    source: OWASP Threat Modeling Project
    version: "maintained-project-guidance"
    status: final
    publishedAt: "2020"
    reviewedAt: "2026-09-06"
    url: "https://owasp.org/www-project-threat-modeling/"
    role: "Methodology-neutral threat modeling entry; Four Question Framework; trust-boundary language"
    notes: "Live-checked 2026-09-06: Status Maintained Project Guidance. The publishedAt year records project/Manifesto provenance, not a frozen guidance release; reviewedAt controls freshness for this living page. The page defines threat modeling as analysis of system representations, recommends Shostack's Four Questions as a methodology-neutral starting point, and calls for continuous refinement when architecture, data flow, or implementation changes. It does not define a single OWASP methodology. Module 3.2 teaches STRIDE as prompts with invalidation conditions, not as a sticker inventory; LINDDUN waits for 5.1. Do not treat Threat Dragon, a diagram, or any tool as the definition of threat modeling."
  - id: nist-sp-800-154
    source: NIST SP 800-154 Guide to Data-Centric System Threat Modeling
    version: "IPD"
    status: draft
    publishedAt: "2016-03"
    reviewedAt: "2026-09-06"
    url: "https://csrc.nist.gov/pubs/sp/800/154/ipd"
    role: "Informative data-centric threat-modeling methodology; not a verification catalogue"
    notes: "Initial Public Draft, March 2016. NIST planning note 2025-01-23 still says the publication will be finalized; it is not final. Module 3.2 treats it as informative only: model attack and defense for selected data, not as a substitute for a version-controlled SecureCollab model with owners and review triggers. Do not present SP 800-154 as a current NIST baseline."
  - id: nist-sp-800-63-4
    source: NIST SP 800-63-4 Digital Identity Guidelines
    version: "4"
    status: final
    publishedAt: "2025-07"
    reviewedAt: "2026-08-23"
    url: "https://pages.nist.gov/800-63-4/"
    role: "Identity proofing, authentication, federation; customer-experience and friction as security outcomes"
    notes: "Suite final (Rev. 4); superseded Rev. 3. This module uses risk/CX/friction language, not the full authenticator catalog (that is 4.1–4.2). Also https://csrc.nist.gov/pubs/sp/800/63/4/final"
  - id: wcag-2.2
    source: W3C Web Content Accessibility Guidelines
    version: "2.2"
    status: final
    publishedAt: "2024-12-12"
    reviewedAt: "2026-08-23"
    url: "https://www.w3.org/TR/WCAG22/"
    role: "Accessibility baseline for security-sensitive web journeys"
    notes: "W3C Recommendation 12 December 2024. Does not deprecate 2.0/2.1. Security flows must not be mouse-only, visual-only, or memory-only."
  - id: owasp-samm-2
    source: OWASP Software Assurance Maturity Model
    version: "2.0"
    status: final
    publishedAt: "2020"
    reviewedAt: "2026-08-23"
    url: "https://owaspsamm.org/model/"
    role: "Governance and measurement of security practice; not a vulnerability list"
    notes: "Five business functions / fifteen practices. This module uses SAMM only for metrics vs vanity and residual-risk communication; full SAMM assessment is E6/10.1."
  - id: rfc-9846-tls-1.3
    source: IETF RFC 9846 TLS 1.3
    version: "RFC 9846"
    status: final
    publishedAt: "2026-07"
    reviewedAt: "2026-08-23"
    url: "https://datatracker.ietf.org/doc/html/rfc9846"
    role: "Current TLS 1.3 protocol specification (obsoletes RFC 8446)"
    notes: "Standards Track, July 2026. Module 2.2 teaches hop authenticity after termination; 'enable TLS' is not the cache-key property."
  - id: rfc-9110-http
    source: IETF RFC 9110 HTTP Semantics
    version: "RFC 9110"
    status: final
    publishedAt: "2022-06"
    reviewedAt: "2026-09-06"
    url: "https://datatracker.ietf.org/doc/html/rfc9110"
    role: "HTTP cacheability, Vary, and method semantics"
    notes: "Standards Track. Module 2.2 uses cacheability and representation selection; it does not treat Vary as a tenant id."
  - id: w3c-csp3
    source: W3C Content Security Policy Level 3
    version: "Level 3"
    status: draft
    publishedAt: "2026-08-13"
    reviewedAt: "2026-08-23"
    url: "https://www.w3.org/TR/CSP3/"
    role: "Browser-enforced content restrictions; not an application guarantee"
    notes: "W3C Working Draft 13 August 2026. Must be labeled draft. Not a substitute for output encoding or Trusted Types."
  - id: w3c-trusted-types
    source: W3C Trusted Types
    version: "WD"
    status: draft
    publishedAt: "2026-06-23"
    reviewedAt: "2026-08-23"
    url: "https://www.w3.org/TR/trusted-types/"
    role: "Typed values at dangerous sinks; layered with CSP"
    notes: "W3C Working Draft 23 June 2026. Label draft. Framework defaults are not Trusted Types."
  - id: owasp-top-10-2025
    source: OWASP Top 10
    version: "2025"
    status: awareness
    publishedAt: "2025"
    reviewedAt: "2026-08-23"
    url: "https://owasp.org/Top10/2025/"
    role: "Risk-awareness and coverage regression only"
    notes: "A10:2025 Mishandling of Exceptional Conditions maps to 2.4 as regression, not as the learning order. A03 supply chain is Phase 10."
  - id: cwe
    source: MITRE CWE
    version: "Top 25 2025 / family refs"
    status: awareness
    publishedAt: "2025"
    reviewedAt: "2026-08-23"
    url: "https://cwe.mitre.org/top25/archive/2025/2025_cwe_top25.html"
    role: "Implementation-oriented weakness families; not the syllabus order"
    notes: "Use to test whether parser/injection families were missed. Do not organize modules as CWE IDs."
  - id: nist-sp-800-218-ssdf
    source: NIST SP 800-218 Secure Software Development Framework (SSDF)
    version: "1.1"
    status: final
    publishedAt: "2022-02"
    reviewedAt: "2026-09-06"
    url: "https://csrc.nist.gov/pubs/sp/800/218/final"
    role: "Secure development practice vocabulary; not a control catalogue for tenant isolation"
    notes: "SSDF 1.1 (SP 800-218) remains the final baseline. SP 800-218 Rev. 1 / SSDF 1.2 is an Initial Public Draft (17 Dec 2025); comment period closed 30 Jan 2026 and is still draft. Module 3.3 uses 1.1 only for design-review vocabulary (PW.1 design); architecture guarantees are the DB-role tests, not an SSDF attestation."
