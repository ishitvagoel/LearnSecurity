  requirementIds:
  - KEV
  url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
misconceptions:
- MTTD is the goal
- Backups untested are recovery
- Disclosure is legal-only
- PagerDuty closes the incident
operationalConsiderations:
- incident_closed_without_recovery denied.
- Some incidents never get perfect forensic certainty — say so.
