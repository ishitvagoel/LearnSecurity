id: '10.5'
slug: logging-detection-incident-response-recovery-and-maintenance
title: Logging, detection, incident response, recovery, and maintenance
phase: 10
track: core
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- 'Prior phase Pass A per blueprint §7; 3.1 log bodies; 5.1 extra copies; 8.5 crash sinks'
routeTags:
- complete
- web-api
releaseMilestone: M4
outcomes:
- 'Refuse closing an incident while recovery is still todo; a green SIEM is not this cell.'
- 'Treat logs as a 3.1/5.1 sink so note bodies cannot live there for forensics.'
- 'Name restore evidence and keep KEV/PagerDuty as inputs not close.'
reviewTriggers:
- Incident closed with recovery todo
- Note bodies in application or SIEM logs
- No restore evidence
- Support tool is god-mode
invariants:
- close_incident without recovery done is false
- note_body must not appear in logs
- Labs stay in authorized local or official training scope
- PagerDuty is not recovery
threatModelPrompts:
- What can go wrong if you close on SIEM green?
- What residual remains if logs contain note bodies?
- What residual remains if the observability pipeline is a 3.1 sink?
concepts:
- recovery-not-detect
- logs-not-bodies
- restore-evidence
- securecollab
- seven-step-loop
learningObjects:
- id: 10.5-LO-01
  kind: concept-model
  title: A green SIEM is not recovery
  path: lessons/01-property.md
- id: 10.5-LO-02
  kind: design-exercise
  title: Close predicate vs detection quality
  path: lessons/02-model.md
- id: 10.5-LO-03
  kind: mechanism-lab
  title: 'Local fixture: always-true close_incident'
  path: lessons/03-break.md
- id: 10.5-LO-04
  kind: design-exercise
  title: Require recovery done and no note_body
  path: lessons/04-build.md
- id: 10.5-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for close
  path: lessons/05-verify.md
- id: 10.5-LO-06
  kind: operations-exercise
  title: incident_closed_without_recovery without logging bodies
  path: lessons/06-operate.md
- id: 10.5-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic close ticket when SIEM is green'
  path: lessons/07-transfer.md
- id: 10.5-LO-08
  kind: code-review
  title: Review always-true close_incident as a PR
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 10.5-lab
  summary: Incident closed without recovery evidence
  forbiddenOutcomes:
  - Incident closed without recovery evidence
  - Note body present in logs
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Detection rules, incident playbook, restore evidence
- Transfer task prompt
- Local lab brief with close-without-recovery deny tests
assessmentBlueprint:
  explain: SIEM green is not recovery; logs are not a body store
  design: Close predicate, log inventory, restore drill
  build: close_incident requires recovery done and no note_body in labs/10.5/10.5-lab/fixed
  break: Authorized local always-true close_incident
  verify: Forbidden-outcome tests plus honest recovery plus safe logs
  operate: incident_closed_without_recovery without secrets
  communicate: Residual imperfect forensics; support-tool god-mode
masteryGate: '10'
