outcomes:
- 'Refuse a production boot with debug enabled; NODE_ENV is not this cell.'
- 'Treat feature flags, migrations, and admin bind addresses as TCB, not as ops leftovers.'
- 'Keep secrets out of traces and name a rollback drill without claiming Gate 10.'
reviewTriggers:
- Production process boots with debug enabled
- Admin bound to 0.0.0.0
- Migration fail-open
- No rollback drill
- Feature flag that disables authorization
invariants:
- boot_ok of prod with debug is false
- Feature flags are in the TCB
- Labs stay in authorized local or official training scope
- CISA Secure by Design is unverified guidance not the oracle
threatModelPrompts:
- What can go wrong if production boots with debug?
- What residual remains if debug is off but a flag disables authz?
- What residual remains if traces already contained secrets?
