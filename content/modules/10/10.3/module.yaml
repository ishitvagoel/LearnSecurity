id: '10.3'
slug: cloud-serverless-containers-kubernetes-and-iac
title: Cloud, serverless, containers, Kubernetes, and IaC
phase: 10
track: core
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- 'Prior phase Pass A per blueprint §7; 3.3 least privilege; 6.5 metadata; 7.4 worker identity'
routeTags:
- complete
- web-api
releaseMilestone: M4
outcomes:
- 'Refuse an app pod that requests cluster-admin; a namespace is not a tenant.'
- 'Treat PSS/PSA as pod-hardening vocabulary and RBAC as authorization; NetworkPolicy is neither.'
- 'Keep instance metadata and break-glass ClusterRoles from becoming ambient authority.'
reviewTriggers:
- App ServiceAccount bound to cluster-admin
- privileged true on an app pod
- Unlabeled namespace under Pod Security Admission
- IaC with 0.0.0.0/0 egress
- IMDS reachable from the app network
invariants:
- pod_ok of cluster-admin is false
- Namespace is not tenant isolation
- Labs stay in authorized local or official training scope
- Managed Kubernetes is not application 1.2
threatModelPrompts:
- What can a compromised app container do with cluster-admin?
- What residual remains if PSS is restricted but RBAC is still cluster-admin?
- What residual remains if IMDS is reachable from the pod network?
concepts:
- workload-identity
- namespace-not-tenant
- pss-not-rbac
- securecollab
- seven-step-loop
learningObjects:
- id: 10.3-LO-01
  kind: concept-model
  title: A namespace is not cluster-admin
  path: lessons/01-property.md
- id: 10.3-LO-02
  kind: design-exercise
  title: Workload identity vs namespace privacy
  path: lessons/02-model.md
- id: 10.3-LO-03
  kind: mechanism-lab
  title: 'Local fixture: always-true pod_ok'
  path: lessons/03-break.md
- id: 10.3-LO-04
  kind: design-exercise
  title: Allowlist namespaced app roles
  path: lessons/04-build.md
- id: 10.3-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for cluster-admin
  path: lessons/05-verify.md
- id: 10.3-LO-06
  kind: operations-exercise
  title: cluster_admin_denied without logging kubeconfig
  path: lessons/06-operate.md
- id: 10.3-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic app SA is cluster-admin'
  path: lessons/07-transfer.md
- id: 10.3-LO-08
  kind: code-review
  title: Review always-true pod_ok as a PR
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 10.3-lab
  summary: App pod granted cluster-admin
  forbiddenOutcomes:
  - App pod granted cluster-admin
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Threat-modeled deployment and IaC/container policy tests
- Transfer task prompt
- Local lab brief with cluster-admin deny tests
assessmentBlueprint:
  explain: Namespace is not tenant isolation; cluster-admin is not least privilege
  design: RBAC vs PSS vs NetworkPolicy vs IMDS as separate planes
  build: pod_ok requires an allowlisted namespaced role in labs/10.3/10.3-lab/fixed
  break: Authorized local always-true pod_ok
  verify: Forbidden-outcome tests plus honest app role
  operate: cluster_admin_denied without secrets
  communicate: Residual break-glass ClusterRole with E6; IMDS hop
masteryGate: '10'
standardsRefs:
- source: NIST SP 800-190 Application Container Security Guide
  version: '800-190'
  status: final
  requirementIds:
  - container-stack
  url: https://csrc.nist.gov/pubs/sp/800/190/final
- source: Kubernetes Pod Security Standards
  version: 'stable'
  status: final
  requirementIds:
  - privileged
  - baseline
  - restricted
  url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-13.2.1
  - v5.0.0-13.2.2
  - v5.0.0-13.2.4
  - v5.0.0-13.2.6
  url: https://owasp.org/www-project-application-security-verification-standard/
misconceptions:
- Namespace equals tenant
- Managed Kubernetes is secure by default
- Containers are VMs
- NetworkPolicy is RBAC
- PSS replaces RBAC
operationalConsiderations:
- cluster_admin_denied.
- Break-glass admin with E6.
