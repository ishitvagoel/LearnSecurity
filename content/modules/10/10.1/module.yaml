id: '10.1'
slug: secure-software-lifecycle-and-security-culture
title: Secure software lifecycle and security culture
phase: 10
track: core
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 3.2 threat modeling; 9.1 coverage
routeTags:
- complete
- web-api
releaseMilestone: M4
outcomes:
- 'Refuse merging a PR without a threat-model identifier for the changed surface; culture is the merge gate, not a poster.'
- 'Treat CODEOWNERS, SAMM scores, and training checkboxes as not merge_ok.'
- 'Keep SSDF 1.1 as the final practice vocabulary and label SSDF 1.2 IPD and CISA Secure by Design as draft/unverified as pinned.'
reviewTriggers:
- Merge without a threat-model identifier
- Security champion optional forever
- Vanity vuln-count KPI offered as Gate 10
- No change-trigger matrix for identity, data, or mobile
invariants:
- merge_ok without threat_model is false
- CODEOWNERS is not a threat model
- Labs stay in authorized local or official training scope
- SSDF 1.2 is labeled draft
threatModelPrompts:
- What can go wrong when security is a later phase?
- What residual remains if every PR has a stale tm-id?
- What residual remains if metrics count posters instead of tests?
concepts:
- merge-gate
- change-trigger
- ssdf-pw1
- securecollab
- seven-step-loop
learningObjects:
- id: 10.1-LO-01
  kind: concept-model
  title: Culture is the merge gate, not a poster
  path: lessons/01-property.md
- id: 10.1-LO-02
  kind: design-exercise
  title: Change-trigger matrix vs CODEOWNERS
  path: lessons/02-model.md
- id: 10.1-LO-03
  kind: mechanism-lab
  title: 'Local fixture: always-true merge_ok'
  path: lessons/03-break.md
- id: 10.1-LO-04
  kind: design-exercise
  title: Require a threat_model identifier
  path: lessons/04-build.md
- id: 10.1-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for merge
  path: lessons/05-verify.md
- id: 10.1-LO-06
  kind: operations-exercise
  title: merge_blocked_no_tm without logging bodies
  path: lessons/06-operate.md
- id: 10.1-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic HIPAA training as merge'
  path: lessons/07-transfer.md
- id: 10.1-LO-08
  kind: code-review
  title: Review always-true merge_ok as a PR
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 10.1-lab
  summary: Merge without a threat-model identifier
  forbiddenOutcomes:
  - Merge without a threat-model identifier
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Lightweight SSDLC, change-trigger matrix, and maturity improvement plan
- Transfer task prompt
- Local lab brief with merge-without-tm deny tests
assessmentBlueprint:
  explain: Merge requires a threat-model id; posters are not culture
  design: Change-trigger matrix for identity, data, mobile, queues
  build: merge_ok requires threat_model in labs/10.1/10.1-lab/fixed
  break: Authorized local always-true merge_ok
  verify: Forbidden-outcome tests plus honest tm id
  operate: merge_blocked_no_tm without bodies
  communicate: Residual stale tm-id; vanity metrics; E6 exceptions
masteryGate: '10'
standardsRefs:
- source: NIST SP 800-218 SSDF
  version: '1.1'
  status: final
  requirementIds:
  - PW.1
  url: https://csrc.nist.gov/pubs/sp/800/218/final
- source: OWASP Software Assurance Maturity Model
  version: '2.0'
  status: final
  requirementIds:
  - Governance
  url: https://owaspsamm.org/model/
- source: CISA Secure by Design
  version: 'current-public-guidance'
  status: unverified
  requirementIds:
  - manufacturer-ownership
  url: https://www.cisa.gov/securebydesign
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-15.1.5
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: NIST SP 800-218 Rev. 1 SSDF
  version: '1.2 IPD'
  status: draft
  requirementIds:
  - SSDF-1.2-IPD
  url: https://csrc.nist.gov/pubs/sp/800/218/r1/ipd
misconceptions:
- CODEOWNERS is a threat model
- A security-champion poster is the merge gate
- Vuln-count KPIs are outcome metrics
- HIPAA training complete authorizes merge
operationalConsiderations:
- merge_blocked_no_tm.
- Count TMs that have tests, not posters.
