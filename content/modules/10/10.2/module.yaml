id: '10.2'
slug: source-control-ci-cd-dependencies-and-software-supply-chain
title: Source control, CI/CD, dependencies, and software supply chain
phase: 10
track: core
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 5.3 secrets; 9.4 scanners as signals
routeTags:
- complete
- web-api
releaseMilestone: M4
outcomes:
- 'Refuse installing a dependency whose digest does not match the lockfile; Dependabot is not this cell.'
- 'Treat SBOM generation as inventory (v5.0.0-15.1.2) and SLSA as provenance vocabulary, not as install_ok.'
- 'Keep fork PRs, unpinned actions, and name-only installs from entering the TCB.'
reviewTriggers:
- Hash mismatch allowed to install
- Unpinned GitHub Action
- Secrets in pull requests from forks
- SBOM generated but never used in verify
invariants:
- install_ok of mismatched digests is false
- SBOM is inventory, not the hash check
- Labs stay in authorized local or official training scope
- SLSA badge is not application 1.2
threatModelPrompts:
- What can go wrong on a name-only install?
- What residual remains if the pinned digest is already malicious?
- What residual remains if the build cache is poisoned?
concepts:
- lockfile-digest
- sbom-inventory
- provenance
- securecollab
- seven-step-loop
learningObjects:
- id: 10.2-LO-01
  kind: concept-model
  title: A name is not a digest
  path: lessons/01-property.md
- id: 10.2-LO-02
  kind: design-exercise
  title: Lockfile verify vs SBOM inventory
  path: lessons/02-model.md
- id: 10.2-LO-03
  kind: mechanism-lab
  title: 'Local fixture: always-true install_ok'
  path: lessons/03-break.md
- id: 10.2-LO-04
  kind: design-exercise
  title: Require expected hash equals got hash
  path: lessons/04-build.md
- id: 10.2-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for mismatch
  path: lessons/05-verify.md
- id: 10.2-LO-06
  kind: operations-exercise
  title: hash_mismatch_denied without logging secrets
  path: lessons/06-operate.md
- id: 10.2-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic npm install in prod pod'
  path: lessons/07-transfer.md
- id: 10.2-LO-08
  kind: code-review
  title: Review always-true install_ok as a PR
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 10.2-lab
  summary: Dependency installed when digest mismatches lockfile
  forbiddenOutcomes:
  - Dependency installed when digest mismatches lockfile
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Hardened pipeline notes, SBOM as inventory, provenance named
- Transfer task prompt
- Local lab brief with hash-mismatch deny tests
assessmentBlueprint:
  explain: Digest match is integrity; SBOM/SLSA are not the check
  design: Lockfiles, who can change them, fork-PR isolation
  build: install_ok requires hash equality in labs/10.2/10.2-lab/fixed
  break: Authorized local always-true install_ok
  verify: Forbidden-outcome tests plus honest matching hashes
  operate: hash_mismatch_denied without secrets
  communicate: Residual pinning malware; cache poisoning; unpinned actions
masteryGate: '10'
