outcomes:
  - Produce a versioned SecureCollab invariant catalogue with at least five testable system-specific rows
  - Separate desired properties from mechanisms, mechanism limits, framework defaults, and evidence
  - Bound claims with assets, attacker capabilities, trust, state, time, forbidden outcomes, residual risk, and review triggers
  - Distinguish root cause, preconditions, impact, prevention, detection, and recovery for a mechanism-only assurance failure
  - Specify normal, negative, abuse, and failure evidence without treating control presence as proof
  - Design privacy-safe operational evidence and bounded response and recovery
  - Transfer the method to a materially changed system and explain which original claims fail
reviewTriggers:
  - SecureCollab gains a new asset, principal, boundary, state transition, channel, or time horizon
  - The lab validator passes a mechanism slogan or rejects a bounded claim for a superficial reason
  - Standards sources change status or version
  - Human recovery, operator compromise, or accessibility assumptions change
  - Generated prose or automated stamps are proposed as semantic review evidence
invariants:
  - Security claims identify subject, action, object, allowed condition, attacker capability, trust, state, and time
  - Properties remain separate from candidate mechanisms and their limits
  - Important claims name observable forbidden outcomes and normal, negative, abuse, and failure evidence
  - Prevention is paired with privacy-safe detection and bounded recovery when it is not absolute
  - Residual risk, non-goals, and product-change review triggers are explicit
  - No live target, real PII, production credential, or implementation proof claim appears
threatModelPrompts:
  - Which concrete observation would falsify this invariant?
  - What can the attacker already do, and which client-controlled labels must be ignored?
  - Which smallest trusted component enforces the property, and what happens if it fails?
  - Which channel, retained state, retry, deletion, or restore interval is missing?
  - Which product change invalidates the row rather than merely extending it?
