misconceptions:
  - Security is a Top 10, CWE, CVE, scanner, certification, or product list
  - CIA labels are complete without product-specific assets, authority, and harms
  - TLS, JWT, password hashing, encryption, validation, or logging is itself the property
  - Authentication implies authorization
  - A happy path, status code, configuration, or control-presence test proves the invariant
  - Privacy equals confidentiality and safety equals availability
  - Universal language needs no channel, time horizon, or trust assumption
  - Prevention eliminates the need for privacy-safe detection and recovery
  - Generated reviewer metadata or schema validity is independent semantic review
operationalConsiderations:
  - Accountability evidence must remain useful without collecting note bodies, passwords, tokens, or unnecessary personal attributes
  - Evidence-pipeline failure behavior is part of the claim and must not silently turn denial into success
  - Containment authority, blast radius, root-cause repair, recovery validation, and communication are explicit
  - Operator compromise and concentration of control over state and evidence remain residual risks
  - Human response and recovery paths require clear status, accessible alternatives, and safe failure behavior
