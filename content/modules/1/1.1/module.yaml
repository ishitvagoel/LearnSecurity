labSpec:
  authorizedScope: Local course files and synthetic SecureCollab data only; no service or network target is required
  slug: 1.1-invariant-catalogue
  summary: Semantic catalogue validator rejects mechanism slogans and requires five bounded, evidenced, operable claims
  forbiddenOutcomes:
    - A control name, awareness list, scanner result, or universal conclusion is accepted as a security invariant
    - Passing YAML shape is presented as proof that a SecureCollab implementation exists or is secure
    - A catalogue omits negative, abuse, or failure evidence and still passes
    - Live-target instructions, real PII, or production credentials enter the lab
evidenceRequired:
  - Five-row SecureCollab invariant catalogue and peer-review classifications
  - Causal annotation of the vulnerable mechanism-only SECURITY.md
  - Clean lab record showing vulnerable failure and fixed success for the intended reason
  - Property-derived mechanism design with alternatives and proof obligations
  - Four-mode forbidden-outcome evidence matrix
  - Privacy-safe detection, response, recovery, residual-risk, and human-factor notes
  - CivicClinic transfer catalogue and comparison memo for transfer-ready evidence
assessmentBlueprint:
  explain: Explain why a bounded property differs from a mechanism, framework default, and evidence item
  design: Produce and defend a five-row SecureCollab catalogue with a complete claim envelope
  build: Derive the smallest candidate mechanism for one property and state proof obligations and limits
  break: Diagnose the local mechanism-only claim by root cause, preconditions, impact, and false assurance
  verify: Specify normal, negative, abuse, and failure evidence with property oracles
  operate: Design privacy-safe signals, containment, root-cause repair, recovery validation, and communication
  communicate: Review mechanism-only claims and explain residual risk and non-goals without universal language
