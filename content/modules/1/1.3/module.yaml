misconceptions:
- TLS is a trust boundary for headers
- Security by an internal-sounding header name
- Defense in depth means any layer can be skipped
operationalConsiderations:
- 'Public-edge log: internal-header-seen without worker identity.'
- A real compromised worker still exports. Detect and revoke (7.4, 10.5).
