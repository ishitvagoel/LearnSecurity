misconceptions:
- Every network hop, TLS connection, process, container, subnet, or diagram line is automatically a trust boundary
- The TCB is a fixed list called the backend or the cloud rather than the components that must be correct for one stated property
- Attack surface means open ports, endpoints, CVEs, or the OWASP Top 10 rather than all reachable influence paths to a protected effect
- Internal names, private addresses, proxy headers, service labels, signed-but-unscoped messages, or possession of a queue record prove caller authority
- A WAF and API check are independent when both parse and trust the same requester-controlled field
- More layers always reduce risk even when they share identity, credentials, parser code, configuration, operators, or failure domains
- A container, tenant column, or separate queue bounds blast radius without proving the data, authority, egress, control-plane, and evidence boundaries
- Logs are outside the attack surface because they are defensive, and an unavailable evidence sink may be ignored
- Completing one diagram closes threat modeling until a formal security review
operationalConsiderations:
- Record caller kind, trusted adapter, action, tenant/object scope, capability identifier hash, decision reason, enforcement point, model version, correlation identifier, and time without recording content, secrets, raw tokens, or unnecessary personal data
- Detect public presentation of internal-only metadata, worker calls arriving through public adapters, scope mismatch, replay, unexpected egress, cross-tenant cache keys, and sudden boundary-denial changes
- State whether a missing or delayed evidence sink blocks, buffers, or degrades an effect; never silently claim detection when evidence can disappear
- Contain the narrow caller, capability class, tenant, action, adapter, or egress path first; then enumerate all paths and shared mechanisms with the same root assumption
- Repair the assumption and enforcement path, rotate or revoke affected authority, reconcile leaked or mutated outputs, restore evidence, retest forbidden outcomes, and refresh the model
- Make diagrams, inventories, alerts, and incident actions readable without color alone and usable by keyboard and assistive technology
- Treat provider, operator, control-plane, backup, and build-system compromise as explicit residual or later-module work rather than hiding it inside a trusted cloud box
