labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 1.3-trust-boundaries
  summary: Client internal header dumps all tenants' notes
  forbiddenOutcomes:
  - Client internal header dumps all tenants' notes
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Annotated trust-boundary diagram for SecureCollab Phase 1
- Attack-surface inventory with an evidence column
- Note on independent vs correlated defensive layers
- Transfer diagram after CDN, queue, or mobile client (for transfer-ready)
assessmentBlueprint:
  explain: TCB vs attack surface vs blast radius; correlated vs independent layers
  design: Annotated diagram plus inventory covering 1.2 matrix paths
  build: Deferred to Pass B; check placement or isolation on a local fixture
  break: Annotation of correlated depth or missing transitive trust
  verify: Surfaces listed with how closure would be tested
  operate: Unexpected caller or egress as a detection signal
  communicate: Residual third-party trust stated without hiding it
masteryGate: '1'
