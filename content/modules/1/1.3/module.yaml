outcomes:
- Define a trust boundary as a change in security assumptions or capabilities, and scope a property-relative trusted computing base without equating either concept with a network hop or deployment box
- Produce and defend an annotated SecureCollab Phase 1 model that names assets, actors, flows, entry points, channels, enforcement points, trusted attribute sources, assumptions, and residual trust
- Build a flow-derived attack-surface inventory that distinguishes reachable entry points and shared mechanisms from generic component, port, vulnerability, or product lists
- Analyze transitive trust, least-common mechanisms, correlated failures, isolation boundaries, and blast radius for human, service, storage, and evidence paths
- Diagnose a boundary failure by separating invariant, preconditions, trigger, root cause, impact, prevention, detection, recovery, and residual risk
- Design a structural boundary repair that establishes trusted provenance, fails safely, preserves complete mediation, narrows authority, and makes defense-in-depth independence claims falsifiable
- Verify and operate boundary controls with normal, negative, abuse, failure, and counterfactual evidence plus change-driven model refresh and bounded incident response
- Transfer the method to PreviewForge, a synthetic document-processing pipeline whose hostile bytes, asynchronous workers, third parties, shared libraries, and egress assumptions materially differ from SecureCollab
reviewTriggers:
- A public ingress, CDN, reverse proxy, gateway, mobile client, webhook, alternate protocol, or administrative route is added or reconfigured
- A queue, scheduler, retry path, batch process, converter, AI component, or other non-human caller gains a new action or authority
- Identity, email, object storage, analytics, logging, monitoring, backup, or another third party begins carrying security-relevant data or decisions
- A cache, parser, credential, runtime, database role, tenant index, log pipeline, or control plane becomes shared across isolation scopes
- An isolation, sandbox, segmentation, or defense-in-depth claim changes without new evidence of failure independence and bounded blast radius
- A data flow, protected property, attacker capability, enforcement point, trusted attribute source, or evidence path changes
- An incident reveals an unmodeled path, common-mode failure, stale assumption, or larger-than-expected blast radius
invariants:
- Every in-scope flow that can reveal, mutate, authorize, enqueue, or record a protected SecureCollab effect crosses a named boundary whose trusted side derives caller and scope from a trusted adapter or records an explicit residual
- No value controlled by the public requester, including an internal-sounding header, tenant label, service name, or object identifier, is itself proof that the request crossed a trusted worker boundary
- Each entry point is linked to its reachable protected effects, enforcement points, shared mechanisms, and an evidence oracle; unmodeled and unknown cases deny rather than inherit ambient authority
- A defense-in-depth claim counts only controls whose relevant failure assumptions and dependencies are stated; layers sharing the same parser, credential, identity assertion, configuration, or operator are treated as correlated
- The blast radius of a compromised or mistaken caller is bounded by explicit tenant, action, object, time, egress, and evidence scopes rather than by naming the component internal
- All practice remains local and synthetic and never supplies live-target instructions, production credentials, real personal data, malware, or harmful payloads
threatModelPrompts:
- What property is being protected, from which attacker or failure capability, over which Phase 1 scope and time window?
- Where do security assumptions or capabilities change, and which flows cross each resulting boundary?
- Which components must be correct for this one property, and how does that TCB change for another property?
- Which entry points, alternate paths, stored inputs, administrative paths, and shared mechanisms can influence the protected effect?
- Which requester-controlled values are being mistaken for authenticated provenance or server-resolved scope?
- What must be trusted transitively if an identity provider, object store, queue, log sink, dependency, or operator fails?
- Which defensive layers can fail together because they share a parser, credential, identity assertion, configuration, runtime, vendor, or human operator?
- If one component or credential is compromised, what data, tenants, actions, time interval, egress destinations, and evidence can it reach or suppress?
- What normal, negative, abuse, failure, and counterfactual observations would falsify the boundary claim?
- What architecture, data-flow, authority, implementation, or incident change forces the model to be refreshed?
