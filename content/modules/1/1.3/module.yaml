labSpec:
  authorizedScope: Local in-process course fixture and synthetic SecureCollab records only; no server, socket, public target, credential, real tenant, or harmful payload
  slug: 1.3-trust-boundaries
  summary: A public caller forges worker identity and scope because correlated edge and API layers trust the same attacker-controlled metadata; the fixed adapter establishes server-side provenance and a tenant-scoped capability
  forbiddenOutcomes:
  - A public caller reaches the worker-only export effect by supplying an internal-sounding header, service label, tenant, or object scope
  - A valid worker capability crosses tenant, action, object, or lifecycle scope or remains usable after consumption
  - Unknown caller kind, missing trusted context, malformed scope, or evidence failure defaults to privileged behavior
  - Correlated controls are counted as independent defense in depth
  - Lab steps address a live target, start a network listener, use real personal data or credentials, or provide a harmful payload
evidenceRequired:
- Annotated SecureCollab Phase 1 trust-boundary diagram with a property-specific TCB overlay and explicit deferred components
- Flow-derived attack-surface inventory linking entry points, channels, attacker control, enforcement, shared mechanisms, blast radius, evidence, and residual risk
- Trust-dependency and control-independence analysis covering at least one transitive dependency and one common-mode failure
- Exact vulnerable and fixed lab results plus causal traces for every intended forbidden outcome
- Boundary repair decision record covering trusted provenance, fail-safe behavior, scoped capability lifecycle, rejected alternatives, and remaining limits
- Five-mode verification matrix with a policy-removal or adapter-bypass counterfactual
- Boundary-operations runbook with privacy-safe signals, evidence failure, containment, root-cause recovery, and review triggers
- PreviewForge transfer model and a comparison memo naming at least four SecureCollab assumptions that no longer hold
assessmentBlueprint:
  explain: Distinguish property-relative TCB, trust boundary, entry point, channel, attack surface, transitive trust, isolation boundary, blast radius, and correlated defense using bounded examples
  design: Produce the annotated SecureCollab diagram, flow-derived inventory, dependency graph, and independence argument with explicit assumptions and residuals
  build: Establish worker provenance in a trusted adapter, consume a tenant/action/object-scoped local capability, and deny unknown or failed context before the protected effect
  break: Demonstrate only in the local fixture how forged metadata, scope widening, replay, alternate paths, and common-mode assumptions violate the stated invariant
  verify: Trace normal, negative, abuse, failure, and counterfactual tests to diagram flows, inventory rows, and forbidden effects
  operate: Define privacy-safe boundary evidence, drift and misuse signals, evidence-pipeline failure behavior, containment, recovery, and model-refresh triggers
  communicate: State what remains transitively trusted, which layers are correlated, the bounded assurance claim, and which decisions belong to later modules
