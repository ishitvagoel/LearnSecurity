id: '1.3'
slug: trust-boundaries-and-attack-surface
title: Trust boundaries and attack surface
phase: 1
track: core
difficulty: foundation
status: reviewed
estimatedMinutes: 240
prerequisites:
- '1.1 Pass A: invariant catalogue'
- '1.2 Pass A: authority map and access matrix'
- 'Entry profile: small database-backed API, Git, tests, basic SQL'
- 0.1 vocabulary recommended, not blocking for Phase 1 spec pilot
routeTags:
- complete
- accelerated
- web-api
- mobile
releaseMilestone: null
outcomes:
- Produce an annotated trust-boundary diagram and attack-surface inventory for SecureCollab
- Identify TCB, entry points, transitive trust, shared mechanisms, isolation boundaries,
  and blast radius
- Explain defense in depth without assuming independent layers
- Place 1.2 mediation checks on boundaries, not only inside a named service
- Transfer the diagram after adding CDN, queue, or mobile client and list invalidated
  1.1/1.2 artifacts
reviewTriggers:
- 'New component: CDN, queue, mobile client, AI summarizer, webhook receiver'
- 'New third party: IdP, email, object storage, analytics'
- Shared cache, search index, or log pipeline added
- Isolation claim without independence analysis
invariants:
- Every data flow that can change a 1.1 invariant crosses a named boundary with a
  named check or an explicit residual
- The client is not in the TCB for authorization or integrity of server-side assets
- Correlated layers are not counted as independent depth
- No live-target or real-PII instructions appear in this module
threatModelPrompts:
- What are we working on (scope, users, dependencies, trust boundaries)?
- What can go wrong at each entry point and shared mechanism?
- Who can we no longer trust if the IdP, email provider, or object store is compromised?
- How far does a worker or admin identity blast if stolen?
concepts:
- trusted-computing-base
