misconceptions:
- Boxes labeled secure zone are a threat model
- The TCB is the server or the cloud provider
- Defense in depth means stacking products with correlated failures
- Attack surface is open ports or the OWASP Top 10
- Clients are trusted if they use HTTPS
- Shared caches, log pipelines, and CI runners are outside the product
- Transitive trust does not count as an entry point
- App-level tenant isolation makes blast radius independent of the database role
operationalConsiderations:
- Detect unexpected identity at a boundary and unexpected egress
- Transitive-trust failures need later revocation/runbook hooks
- Log pipelines are both evidence and an exfiltration surface
- WAF, CDN, or framework edge defaults are not the application TCB or an independent layer
- Detection UX and accessibility of human response are designed in 1.4
