misconceptions:
- Residual risk is a yellow scanner
- Usability is the opposite of security; accessibility is later compliance
- Work factor is key length
- Users who bypass a control are the problem
- Detection without recovery is resilience
- NIST 800-63 is a password-complexity checklist
- SAMM scores prove the product is secure
- Secure by Design means the customer bought MFA
operationalConsiderations:
- Detection and recovery are residual-risk controls
- Support tools must not become unaudited impersonation
- Course harm scenarios stay synthetic
