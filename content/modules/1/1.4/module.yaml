misconceptions:
- Accessibility is a separate compliance track from security
- Friction always increases security
- Work factor applies only to attackers, not to legitimate users stuck in a flow
operationalConsiderations:
- Recovery success/fail by input modality; never log recovery codes.
- 'Coercion: a physically present attacker can still force a confirmation. Record
  as residual (do not pretend UX fixes coercion).'
