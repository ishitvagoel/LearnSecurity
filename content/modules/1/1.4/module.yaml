id: '1.4'
slug: risk-people-economics-usable-security-resilience
title: Risk, people, economics, usable security, and resilience
phase: 1
track: core
difficulty: foundation
status: published
estimatedMinutes: 270
prerequisites:
- '1.1 Pass A: invariant catalogue'
- '1.2 Pass A: authority map'
- '1.3 Pass A: trust boundaries'
- 'Entry profile: small database-backed API, Git, tests, basic SQL'
routeTags:
- complete
- accelerated
- web-api
- mobile
releaseMilestone: null
outcomes:
- Produce a SecureCollab risk register with assumptions, uncertainty, user-harm, residual
  risk, and owners
- Model threat actors by capability and incentive, including human error, coercion,
  and abuse economics
- Treat security friction and inaccessibility as security outcomes
- Include graceful degradation, detection, and recovery when prevention is not absolute
- Transfer the register after changed actor capability or a failing accessible recovery
  flow
reviewTriggers:
- New high-impact user journey (recovery, invite, impersonation, billing)
- Actor model change (insider, coerced user, bulk automation)
- Accessibility complaint or lockout incident
- Residual accepted without owner or expiry
invariants:
- Every high-impact 1.1 invariant has residual, owner, and revisit trigger
- Inaccessible or unusable security flows are recorded as security failures
- Vanity metrics are not presented as residual risk
- No live-target or real-PII instructions appear in this module
threatModelPrompts:
- Who is harmed (user, tenant, coerced user, bystander)?
- What is the cheapest abuse that still pays?
- Which assumptions are untested (honest lab, trusted operator, honest IdP)?
concepts:
- threat-actor-capability
- incentive
- work-factor
- residual-risk
- user-harm
- security-friction
- accessibility
- graceful-degradation
- psychological-acceptability
- vanity-versus-outcome-metrics
learningObjects:
- id: 1.4-LO-01
  kind: concept-model
  title: Actors, incentives, work factor, residual risk vs vanity metrics
  path: lessons/01-property.md
- id: 1.4-LO-02
  kind: design-exercise
  title: SecureCollab risk register with assumptions and user-harm scenarios
  path: lessons/02-model.md
- id: 1.4-LO-03
  kind: mechanism-lab
  title: 'Local fixture: a secure recovery flow that is unusable without a mouse or named control'
  path: lessons/03-break.md
- id: 1.4-LO-04
  kind: design-exercise
  title: Reduce friction without weakening the 1.1 invariant
  path: lessons/04-build.md
- id: 1.4-LO-05
  kind: verification-lab
  title: Test plan for lockout, bypass, and inaccessible recovery
  path: lessons/05-verify.md
- id: 1.4-LO-06
  kind: operations-exercise
  title: 'Degrade, detect, recover: one scenario with CSF outcome labels'
  path: lessons/06-operate.md
- id: 1.4-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic step-up and banking re-auth'
  path: lessons/07-transfer.md
- id: 1.4-LO-08
  kind: code-review
  title: Seeded risk register that lists tools instead of harm
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 1.4-risk-register
  summary: Local recovery-confirm fixture; inaccessible control is a security failure
  forbiddenOutcomes:
  - High-impact recovery control is color- or mouse-only
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Risk register with assumptions, uncertainty, user-harm, residual, owners
- WCAG-oriented notes for one recovery/auth journey
- Degrade/detect/recover scenario
- Transfer register after actor or a11y change (for transfer-ready)
assessmentBlueprint:
  explain: Actor vs vulnerability; friction as security
  design: Register completeness vs 1.1–1.3 artifacts
  build: Deferred to Pass B; usable recovery change on local fixture
  break: Unusable control annotated as a security failure
  verify: Lockout, bypass, and accessibility forbidden outcomes
  operate: Degrade/detect/recover scenario labeled with CSF functions
  communicate: Residual risk with owner and trigger, without compliance theater
masteryGate: '1'
