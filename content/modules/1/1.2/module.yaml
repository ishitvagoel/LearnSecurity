labSpec:
  authorizedScope: Local Python files and synthetic SecureCollab tenants, users, notes, and decisions only; no service or network target exists
  slug: 1.2-authority-matrix
  summary: An explicit server-side policy mediates note read, list, delete, revocation, unknown actions, and an illustrative two-person export decision
  forbiddenOutcomes:
    - An authenticated Tenant B member reads or lists a Tenant A note
    - A Tenant A administrator deletes a Tenant B note because admin is treated as global
    - A revoked member retains note authority through ambient authentication state
    - One approval satisfies the documented two-person export rule
    - An unknown action or failed authority resolution defaults to allow
    - Lab instructions or data refer to a public target, real person, or production credential
evidenceRequired:
  - SecureCollab Phase 1 authority map and matrix with direct and indirect enforcement inventory
  - Classification of roles, ACLs, capabilities, delegation, and ambient authority as representations or authority sources
  - Causal annotation of vulnerable failures before inspecting the fixed tree
  - Clean vulnerable-fail and fixed-pass lab record with reasons for each failure
  - Policy-decision and enforcement-point design record with alternatives, limits, and current-state behavior
  - Normal, negative, abuse, and failure authority-test matrix plus a policy-removal counterfactual
  - Privacy-safe grant, denial, revocation, break-glass, and recovery runbook with human-factor constraints
  - ReleaseDesk authority model and SecureCollab comparison memo for transfer-ready evidence
assessmentBlueprint:
  explain: Explain authority as a bounded permission relation and distinguish identity, roles, ACLs, capabilities, delegation, and ambient authority
  design: Produce and defend a complete SecureCollab authority map, matrix, and enforcement inventory
  build: Design or implement a current server-resolved policy decision consumed by every in-scope operation
  break: Diagnose missing mediation, unscoped administration, stale authority, insufficient separation, and fail-open unknown cases in the local fixture
  verify: Derive normal, negative, abuse, failure, and counterfactual evidence from matrix cells and authority lifecycle
  operate: Specify privacy-safe decisions, signals, revocation, break-glass, response, recovery, and accessible administration
  communicate: Write actionable review comments and defend residual risk, non-goals, standards applicability, and transfer limits
