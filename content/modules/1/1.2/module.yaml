misconceptions:
  - Authentication proves authorization
  - A role is the authority model rather than a compression of matrix cells
  - Hidden controls or random identifiers are enforcement or capabilities by themselves
  - One HTTP policy check mediates aggregate, admin, worker, cache, retry, and restore paths
  - Admin is a global boolean with no tenant, action, state, or time
  - A central policy engine guarantees complete mediation without enforcement coverage
  - Blocking known bad cases is a fail-safe default
  - Delegation can create authority the issuer does not hold
  - Revocation is complete when a UI option disappears
  - Two actions by one principal are separation of privilege
  - ASVS, scanners, or a passing happy path prove authorization completeness
operationalConsiderations:
  - Grant, use, denial, expiry, revocation, and emergency override have versioned privacy-safe evidence
  - Policy and evidence failures have explicit fail-closed behavior and independent health signals
  - Stale decisions, cached attributes, sessions, and self-contained grants have bounded revocation behavior
  - High-impact authority is narrow, time-bounded, independently approved where justified, and followed by review
  - Administrators can understand the requested effect, object scope, duration, and completion state without color-only or pointer-only interaction
  - One operator controlling protected state, policy, revocation, and the only evidence store remains explicit residual risk
