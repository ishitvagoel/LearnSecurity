releaseMilestone: null
outcomes:
  - Produce a reviewable SecureCollab authority map and access matrix with subject, object, action, conditions, source of authority, and time
  - Distinguish authentication, authorization, roles, ACLs, capabilities, delegation, and ambient authority
  - Derive least privilege, complete mediation, fail-safe defaults, separation of privilege, and secure initial states from forbidden outcomes
  - Diagnose direct, aggregate, administrative, stale-authority, and unknown-policy failures causally
  - Design a small trusted policy path with current server-resolved attributes and explicit enforcement points
  - Turn matrix cells and authority-lifecycle changes into normal, negative, abuse, and failure evidence
  - Design privacy-safe grant, denial, expiry, revocation, break-glass, and recovery evidence with usable administration
  - Transfer the authority model to a time-bounded release-approval system with a machine principal and two-person approval
reviewTriggers:
  - A new principal, role, delegation type, capability, emergency path, or machine identity is introduced
  - An object gains fields with different read or write rules, or a new lifecycle state
  - A route, cache, worker, retry, import, export, restore, or maintenance path reaches protected state
  - Authority is cached, embedded in a token, copied to a device, or evaluated across services
  - Revocation timing, policy availability, evidence durability, or administrative usability changes
  - ASVS or another pinned source changes version or status
  - A central policy library or passing tests are presented as proof of complete mediation without an enforcement inventory
invariants:
  - Every in-scope security-relevant effect has a positive current subject-object-action rule and an identified enforcement point
  - Unknown subject, object, action, grant, state, or policy failure denies for the scoped fixture
  - Tenant administration is bound to its tenant and action rather than treated as ambient global authority
  - Delegated authority is no broader than its justified source, scope, constraints, and lifetime
  - Authentication and identifier knowledge are never treated as sufficient authorization evidence
  - High-impact illustrative export authority requires the documented independent conditions
  - Authority evidence excludes note bodies, credentials, tokens, and unnecessary personal data
  - No public target, real PII, production credential, or implementation-wide assurance claim appears
threatModelPrompts:
  - Which originating and effective subject causes the effect, and what is the source of that authority?
  - Which direct, aggregate, administrative, cached, background, retry, restore, or maintenance path can reach the object?
  - Which subject, object, action, state, or context attribute is controlled by the requester rather than resolved by a trusted component?
  - What happens when the policy is unknown, stale, unavailable, or changed after authentication?
  - Can a delegate grant more authority than the issuer has, or keep using it after expiry or revocation?
  - Which two genuinely independent conditions protect the highest-impact action, and how can each fail?
