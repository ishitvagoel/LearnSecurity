id: E1
slug: ai-llm-and-agentic-application-security
title: AI, LLM, and agentic application security
phase: 7
track: elective
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- 'Opens after Phase 7; 1.2 mediation; 6.1 interpreters; 8.1 hostile client'
routeTags:
- complete
- elective
releaseMilestone: M2
outcomes:
- 'Refuse a model-proposed exec_sql tool; the model is an untrusted client.'
- 'Treat LLM Top 10 2026 as awareness after the allowlist cause, not as AISVS.'
- 'Keep retrieved documents and system prompts from becoming policy.'
reviewTriggers:
- exec_sql available to the agent
- Policy only in the system prompt
- No denied-tool test
- Retrieved docs treated as trusted
invariants:
- run_tool of exec_sql is None
- The model is outside the TCB
- Labs stay in authorized local or official training scope
- LLM Top 10 is not ASVS
threatModelPrompts:
- What can a note body make the agent do?
- What residual remains if policy lives only in the prompt?
- What residual remains if search_notes returns untrusted HTML?
concepts:
- model-not-tcb
- tool-allowlist
- excessive-agency
- securecollab
- seven-step-loop
learningObjects:
- id: E1-LO-01
  kind: concept-model
  title: A model proposal is not authorization
  path: lessons/01-property.md
- id: E1-LO-02
  kind: design-exercise
  title: Tool matrix vs system prompt
  path: lessons/02-model.md
- id: E1-LO-03
  kind: mechanism-lab
  title: 'Local fixture: always-run run_tool'
  path: lessons/03-break.md
- id: E1-LO-04
  kind: design-exercise
  title: Allowlist tools in the runtime
  path: lessons/04-build.md
- id: E1-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for exec_sql
  path: lessons/05-verify.md
- id: E1-LO-06
  kind: operations-exercise
  title: tool_denied without logging transcripts
  path: lessons/06-operate.md
- id: E1-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic summarizer over charts'
  path: lessons/07-transfer.md
- id: E1-LO-08
  kind: code-review
  title: Review always-run run_tool as a PR
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: e1-lab
  summary: Agent executes exec_sql because the model asked
  forbiddenOutcomes:
  - Agent executes exec_sql because the model asked
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- AI-feature threat model and adversarial evaluation
- Transfer task prompt
- Local lab brief with exec_sql deny tests
assessmentBlueprint:
  explain: Model output is not policy; allowlist is mediation
  design: Tools, who may call them, retrieved docs untrusted
  build: run_tool requires allowlist in labs/E1/e1-lab/fixed
  break: Authorized local always-run run_tool
  verify: Forbidden-outcome tests plus honest search_notes
  operate: tool_denied without bodies
  communicate: Residual prompt-only policy; hallucinated packages
masteryGate: '7'
standardsRefs:
- source: OWASP Artificial Intelligence Security Verification Standard
  version: '1.0'
  status: final
  requirementIds:
  - v1.0-C9.5.3
  - v1.0-C9.3.7
  - v1.0-C9.2.8
  url: https://owasp.org/www-project-artificial-intelligence-security-verification-standard-aisvs-docs/
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-8.2.1
  - v5.0.0-13.2.1
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: OWASP GenAI LLM Top 10
  version: '2026'
  status: awareness
  requirementIds:
  - LLM03
  url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
- source: NIST AI 600-1 Generative AI Profile
  version: '600-1'
  status: final
  requirementIds:
  - GenAI-profile
  url: https://doi.org/10.6028/NIST.AI.600-1
- source: NIST SP 800-218A SSDF Community Profile for Generative AI
  version: '800-218A'
  status: final
  requirementIds:
  - SSDF-AI
  url: https://csrc.nist.gov/pubs/sp/800/218/a/final
misconceptions:
- LLM Top 10 is ASVS for AI
- RAG is safe because it is our data
- The model is in the TCB
- A system prompt is complete mediation
operationalConsiderations:
- tool_denied.
- Hallucinated packages (10.2) in copilot use.
