id: E4
slug: memory-safety-and-native-code-boundaries
title: Memory safety and native-code boundaries
phase: 7
track: elective
difficulty: advanced
status: reviewed
estimatedMinutes: 240
prerequisites:
- 'Opens after Phase 7; 1.2 mediation; 6.4 file/FFI'
routeTags:
- complete
- elective
releaseMilestone: M2
outcomes:
- 'Refuse a copy that exceeds the destination length; Python slice is not what C does.'
- 'Treat CISA memory-safe roadmaps as manufacturer guidance, not as the lab oracle.'
- 'Keep FFI, integer wrap, and existing C codecs as named residuals without native PoCs.'
reviewTriggers:
- Copy exceeds destination
- Native exploit in learner pages
- FFI unmarked
- CWE used as syllabus
invariants:
- copy_into of 4-byte dest with declared 4 returns at most 4 bytes
- Labs stay in authorized local or official training scope
- No weaponized native exploits
- CWE Top 25 is awareness after the cause
threatModelPrompts:
- What can a hostile size field do at an FFI boundary?
- What residual remains if new code is memory-safe but old codecs are not?
- What residual remains on integer wrap of n?
concepts:
- length-is-mediation
- ffi-boundary
- memory-safe-roadmap
- securecollab
- seven-step-loop
