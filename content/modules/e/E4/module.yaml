labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: e4-lab
  summary: Copy into a 4-byte lab buffer returns more than 4 bytes
  forbiddenOutcomes:
  - Copy into a 4-byte lab buffer returns more than 4 bytes
  - Weaponized native exploits
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Memory-safety roadmap or hardened native component named
- Transfer task prompt
- Local lab brief with oversize-copy deny tests
assessmentBlueprint:
  explain: Length is mediation of the buffer; C will not slice for you
  design: dst vs declared vs src; FFI residual
  build: copy_into uses min of three lengths in labs/E4/e4-lab/fixed
  break: Authorized local declared_len plus 8
  verify: Forbidden-outcome tests plus honest short copy
  operate: copy_length_denied without file bytes
  communicate: Residual FFI; integer wrap; existing C codecs
masteryGate: '7'
