releaseMilestone: M2
outcomes:
- 'Refuse treating Content-Security-Policy-Report-Only as isolation enforcement.'
- 'Treat CSP3 and Trusted Types as draft layers after encoding, not as 6.2.'
- 'Keep edge-cache header stripping from looking like a green dashboard.'
reviewTriggers:
- Report-Only counted as enforcement
- JSONP leftover
- Trusted Types claimed as encoding
- Edge cache stripping CSP
invariants:
- isolation_enforced of Report-Only is false
- CSP is a layer not encoding
- Labs stay in authorized local or official training scope
- CSP3 is draft
threatModelPrompts:
- What can XSS do when CSP is Report-Only?
- What residual remains if CSP is enforcing but encoding is skipped?
- What residual remains if the CDN strips the enforcing header?
concepts:
- report-only-not-enforcement
- csp-as-layer
- edge-header-trust
- securecollab
- seven-step-loop
