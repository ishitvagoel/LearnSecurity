labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: e2-lab
  summary: Report-Only treated as isolation enforcement
  forbiddenOutcomes:
  - Report-Only treated as isolation enforcement
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Advanced edge/browser assessment
- Transfer task prompt
- Local lab brief with Report-Only deny tests
assessmentBlueprint:
  explain: Report-Only is a signal; enforcing CSP is a layer
  design: Headers, encoding, edge cache
  build: isolation_enforced requires Content-Security-Policy in labs/E2/e2-lab/fixed
  break: Authorized local Report-Only counted as on
  verify: Forbidden-outcome tests plus honest enforcing CSP
  operate: csp_report_only_not_enforced without HTML bodies
  communicate: Residual XS-Leaks; Trusted Types draft; cache stripping
masteryGate: '7'
