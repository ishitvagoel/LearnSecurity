  version: 'Level 3'
  status: draft
  requirementIds:
  - CSP3
  url: https://www.w3.org/TR/CSP3/
- source: W3C Trusted Types
  version: 'WD'
  status: draft
  requirementIds:
  - Trusted-Types
  url: https://www.w3.org/TR/trusted-types/
misconceptions:
- Report-Only is isolation
- Helmet defaults are the guarantee
- CSP replaces encoding
operationalConsiderations:
