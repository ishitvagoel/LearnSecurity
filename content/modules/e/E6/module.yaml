id: E6
slug: product-security-leadership
title: Product security leadership
phase: 7
track: elective
difficulty: advanced
status: reviewed
estimatedMinutes: 240
prerequisites:
- 'Opens after Phase 7; 1.4 accessibility residual; 10.1 lifecycle; 9.5 retest'
routeTags:
- complete
- elective
releaseMilestone: M2
outcomes:
- 'Refuse a risk exception that has no owner, review date, or accessibility check.'
- 'Treat SAMM, CSF, and SSDF as measurement vocabulary, not as the register row.'
- 'Keep CISA Secure by Design unlabeled-unverified as a pledge, not as Gate 7.'
reviewTriggers:
- Empty owner accepted
- No review_by
- Accessibility not in the schema
- SAMM slide as the exception
invariants:
- accept_exception of empty owner is false
- Labs stay in authorized local or official training scope
- SAMM is not the exception
- CISA Secure by Design stays unverified
threatModelPrompts:
- What happens if an exception is oral?
- What residual remains if the register is never read?
- What residual remains if recovery is inaccessible (1.4)?
concepts:
- exception-is-a-record
- samm-not-register
- accountable-residual
- securecollab
- seven-step-loop
learningObjects:
- id: E6-LO-01
  kind: concept-model
  title: Oral acceptance is not a register row
  path: lessons/01-property.md
- id: E6-LO-02
  kind: design-exercise
  title: Owner, review date, and WCAG flag
  path: lessons/02-model.md
- id: E6-LO-03
  kind: mechanism-lab
  title: 'Local fixture: always-accept exception'
  path: lessons/03-break.md
- id: E6-LO-04
  kind: design-exercise
  title: Require owner, review_by, and wcag_checked
  path: lessons/04-build.md
- id: E6-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for incomplete exception
  path: lessons/05-verify.md
- id: E6-LO-06
  kind: operations-exercise
  title: exception_incomplete_denied without logging secrets
  path: lessons/06-operate.md
- id: E6-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic HIPAA exception'
  path: lessons/07-transfer.md
- id: E6-LO-08
  kind: code-review
  title: Review always-accept exception as a PR
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: e6-lab
  summary: Risk exception accepted without owner and review date
  forbiddenOutcomes:
  - Risk exception accepted without owner and review date
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- One-year product security roadmap
- Transfer task prompt
- Local lab brief with incomplete-exception deny tests
assessmentBlueprint:
  explain: An exception is a dated owned record; SAMM is not that row
  design: Owner, review_by, wcag_checked, expiry
  build: accept_exception requires fields in labs/E6/e6-lab/fixed
  break: Authorized local always-accept
  verify: Forbidden-outcome tests plus honest complete exception
  operate: exception_incomplete_denied without secrets
  communicate: Residual unread register; renamed tech-debt
masteryGate: '7'
standardsRefs:
- source: OWASP Software Assurance Maturity Model
  version: '2.0'
  status: final
  requirementIds:
  - governance-measurement
  url: https://owaspsamm.org/model/
- source: NIST Cybersecurity Framework
  version: '2.0'
  status: final
  requirementIds:
  - GV
  url: https://www.nist.gov/cyberframework
- source: NIST SP 800-218 SSDF
  version: '1.1'
  status: final
  requirementIds:
  - PW.1
  url: https://csrc.nist.gov/pubs/sp/800/218/final
- source: CISA Secure by Design
  version: 'current-public-guidance'
  status: unverified
  requirementIds:
  - manufacturer-ownership
  url: https://www.cisa.gov/securebydesign
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-15.1.5
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: W3C Web Content Accessibility Guidelines
