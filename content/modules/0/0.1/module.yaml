  path: lessons/07-transfer.md
- id: 0.1-LO-08
  kind: code-review
  title: Review any-URL-in-scope as a PR
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 0.1-orientation
  summary: HTTP to a non-allowlisted host treated as authorized
  forbiddenOutcomes:
  - HTTP to a non-allowlisted host treated as authorized
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Personal lab rules, scope template, vocabulary map
- Transfer task prompt
- Local lab brief with public-host deny tests
assessmentBlueprint:
  explain: Scope is a property of the tester; reachability is not authorization
  design: Named hosts, stop condition, vocabulary map
  build: target_is_authorized allow-list in labs/0.1/0.1-orientation/fixed
  break: Authorized local any-URL-true
  verify: Forbidden-outcome tests plus honest localhost
  operate: out_of_scope without response bodies
  communicate: Residual hosts-file aliases; official Juice Shop on your machine
masteryGate: '0'
standardsRefs:
- source: NIST Cybersecurity Framework
  version: '2.0'
  status: final
  requirementIds:
  - GV
  - ID
  url: https://www.nist.gov/cyberframework
- source: OWASP Web Security Testing Guide
  version: '4.2'
  status: final
  requirementIds:
  - method-catalogue
  url: https://owasp.org/www-project-web-security-testing-guide/v42/
- source: NIST SP 800-181 Rev. 1 NICE Workforce Framework
  version: '800-181r1'
  status: final
  requirementIds:
  - role-language
  url: https://csrc.nist.gov/pubs/sp/800/181/r1/final
- source: W3C Web Content Accessibility Guidelines
  version: '2.2'
  status: final
  requirementIds:
  - informed-consent-ui
  url: https://www.w3.org/TR/WCAG22/
misconceptions:
- If it has a login page it is a lab
- WSTG chapter titles are the syllabus
- Defensive learning requires attacking strangers
- Burp existing is authorization
operationalConsiderations:
- Denied-host log line with url and reason=out_of_scope; never store response bodies
  from out-of-scope hosts.
- Official Juice Shop on your machine is OK; a random cloud Juice Shop you do not
  own is not.
