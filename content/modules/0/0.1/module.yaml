id: '0.1'
slug: security-engineering-orientation
title: Security engineering orientation
phase: 0
track: core
difficulty: foundation
status: draft
estimatedMinutes: 15
prerequisites:
- 'None; start here'
routeTags:
- complete
- web-api
releaseMilestone: null
outcomes:
- 'State the course outcome, authorized local scope, and first action.'
- 'Refuse treating a public URL as authorized just because TCP connects.'
- 'Treat WSTG as a method catalogue, not as a licence to scan the internet.'
reviewTriggers:
- Any URL treated as in-scope
- No stop condition on redirect
- Live-target language in a learner note
- Quiz score treated as scan permission
invariants:
- target_is_authorized of example.com is false
- Labs stay in authorized local or official training scope
- WSTG is not a scanning licence
- Reachability is not authorization
threatModelPrompts:
- What can a tired learner paste into a proxy?
- What residual remains if /etc/hosts aliases a public name to localhost?
- What residual remains if a redirect leaves 127.0.0.1?
concepts:
- reachability-not-authorization
- written-scope
- vocabulary-map
- securecollab
- seven-step-loop
learningObjects:
- id: 0.1-LO-01
  kind: concept-model
  title: Course outcome and authorized scope
  path: lessons/01-property.md
- id: 0.1-LO-02
  kind: design-exercise
  title: Model the host check and stop condition
  path: lessons/02-model.md
- id: 0.1-LO-03
  kind: mechanism-lab
  title: Break, repair, and verify the local host gate
  path: lessons/03-practice.md
- id: 0.1-LO-04
  kind: transfer-challenge
  title: Operate and review the scope rule
  path: lessons/04-operate-transfer-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 0.1-orientation
  summary: HTTP to a non-allowlisted host treated as authorized
  forbiddenOutcomes:
  - HTTP to a non-allowlisted host treated as authorized
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Personal lab rules, scope template, vocabulary map
- Transfer task prompt
- Local lab brief with public-host deny tests
assessmentBlueprint:
  explain: Scope is a property of the tester; reachability is not authorization
  design: Named hosts, stop condition, vocabulary map
  build: target_is_authorized allow-list in labs/0.1/0.1-orientation/fixed
  break: Authorized local any-URL-true
  verify: Forbidden-outcome tests plus honest localhost
  operate: out_of_scope without response bodies
  communicate: Residual hosts-file aliases; official Juice Shop on your machine
masteryGate: '0'
standardsRefs:
- source: NIST Cybersecurity Framework
  version: '2.0'
  status: final
  requirementIds:
  - GV
  - ID
  url: https://www.nist.gov/cyberframework
- source: OWASP Web Security Testing Guide
  version: '4.2'
  status: final
  requirementIds:
  - method-catalogue
  url: https://owasp.org/www-project-web-security-testing-guide/v42/
- source: NIST SP 800-181 Rev. 1 NICE Workforce Framework
  version: '800-181r1'
  status: final
  requirementIds:
  - role-language
  url: https://csrc.nist.gov/pubs/sp/800/181/r1/final
- source: W3C Web Content Accessibility Guidelines
  version: '2.2'
  status: final
  requirementIds:
  - informed-consent-ui
  url: https://www.w3.org/TR/WCAG22/
misconceptions:
- If it has a login page it is a lab
- WSTG chapter titles are the syllabus
- Defensive learning requires attacking strangers
- Burp existing is authorization
operationalConsiderations:
- Denied-host log line with url and reason=out_of_scope; never store response bodies
  from out-of-scope hosts.
- Official Juice Shop on your machine is OK; a random cloud Juice Shop you do not
  own is not.
author: deepen-curriculum / author-module-spec
