labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 0.1-orientation
  summary: HTTP to a non-allowlisted host treated as authorized; a lookalike hostname
    or a URL parse failure treated as authorized
  forbiddenOutcomes:
  - HTTP to a non-allowlisted host treated as authorized
  - A hostname containing, prefixed by, or suffixed with an allowed name treated as
    that allowed host
  - A URL the checker cannot parse, or a non-string argument, treated as authorized
    instead of denied
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Personal lab rules, scope template, vocabulary map naming WSTG/NICE/CSF as
  vocabulary, not authorization
- Transfer task prompt (contractor WordPress; company staging URL), with a named
  written artifact for each
- Local lab brief with public-host, lookalike-host, and malformed-URL deny tests
assessmentBlueprint:
  explain: Scope is a property of the tester; reachability is not authorization;
    a vocabulary term is not a target list
  design: Named hosts, exact-match comparison, stop condition, vocabulary map
  build: target_is_authorized allow-list with fail-closed parse handling in
    labs/0.1/0.1-orientation/fixed
  break: Authorized local any-URL-true; watch the vulnerable file ignore its input
  verify: Forbidden-outcome tests (public, lookalike, malformed) plus honest
    localhost, and two anti-fake fakes traced by hand
  operate: out_of_scope without response bodies
  communicate: Residual hosts-file aliases and redirects; official Juice Shop on
    your machine; a concrete written scope artifact for a contractor engagement
masteryGate: '0'
