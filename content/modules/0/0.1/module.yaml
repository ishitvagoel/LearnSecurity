releaseMilestone: null
outcomes:
- 'Given a URL, decide whether target_is_authorized returns true by checking the
  parsed hostname against the written local allow-list, not whether the host
  answers a connection, renders a login page, or presents a valid certificate.'
- 'Given a citation of WSTG chapter titles, NICE work-role titles, or CSF
  Govern/Identify outcome labels in a scope discussion, identify that none of
  them can add a host to the allow-list, and state what written artifact would.'
- 'Given a URL target_is_authorized cannot parse, or a non-string argument,
  state that the correct verdict is False and explain why raising an exception
  or defaulting to True is unacceptable.'
- 'Given a hostname that contains, starts with, or ends with an allowed name
  (for example evillab.securecollab.test), determine that it is not a member
  of the allow-list and explain why a substring, prefix, or suffix comparison
  would wrongly authorize it.'
- 'Given a denied host, write the out_of_scope signal that records the host
  and reason, and state why the response the host returned must never be
  captured, logged, or screenshotted.'
- 'Transfer the reachability, vocabulary, fail-closed, and exact-match rules
  to a contractor asked to test a customer WordPress site and to a proposed
  company staging URL, naming a concrete written artifact for each rather
  than treating either request as self-authorizing.'
reviewTriggers:
- Any URL treated as in-scope
- No stop condition on redirect
- Live-target language in a learner note
- Quiz score treated as scan permission
- A lookalike hostname (prefix or suffix of an allowed name) treated as allow-listed
- A URL parse failure treated as an allowed verdict instead of a denial
invariants:
- target_is_authorized of example.com is false
- target_is_authorized of an unparseable or non-string URL is false, not raised
- target_is_authorized of a hostname that merely contains an allowed name is false
- Labs stay in authorized local or official training scope
- WSTG, NICE, and CSF are vocabulary, not a scanning licence
- Reachability is not authorization
threatModelPrompts:
- What can a tired learner paste into a proxy?
- What residual remains if /etc/hosts aliases a public name to localhost?
- What residual remains if a redirect leaves 127.0.0.1?
- Who benefits if a scope checker's parse failure is silently treated as allowed
  by whatever code calls it next?
