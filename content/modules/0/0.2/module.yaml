id: '0.2'
slug: diagnostic-and-adaptive-bridge
title: Diagnostic and adaptive bridge
phase: 0
track: bridge
difficulty: foundation
status: published
estimatedMinutes: 240
prerequisites:
- '0.1 orientation; diagnostics never skip 1.2 or Gate 1'
routeTags:
- complete
- web-api
- bridge
releaseMilestone: null
outcomes:
- 'Refuse a diagnostic score, at any value, as authorization to skip modules 1.2, 1.3, 1.4, or Gate 1''s evidence review.'
- 'Grant a tooling-bridge skip only on the diagnostic''s own observed gap evidence, never on a job title, vendor certification, or LMS badge claim.'
- 'Keep modules 1.2, 1.3, and 1.4 in every learner''s required path regardless of score, fast-track flag, or bridge assignment.'
- 'Treat the NICE Secure Systems Development work role as informative placement vocabulary, not as Gate 1 evidence or a substitute syllabus.'
- 'Record a denied skip attempt without leaking the diagnostic''s item text, answer content, or a badge image, and without back-dating Gate 1.'
- 'Transfer claims C1-C4 to a clinic''s hiring diagnostic and a vendor certification, naming which claim needs its standard reference swapped.'
reviewTriggers:
- Score grants Phase 1 skip
- No link from diagnostic to 1.2 evidence
- Badge screenshot as Gate 1
- Adaptive path hides 1.4 residual
- A credential accepted in place of diagnostic evidence
invariants:
- quiz_score_grants_phase1_skip of 100 is false
- tooling_bridge_required reads only diagnostic_gap; job_title, vendor_cert, and lms_badge are never read
- phase1_modules_for_learner's required set is always {1.2, 1.3, 1.4}
- Labs stay in authorized local or official training scope
- Placement is not a security clearance
- Tool fluency is not threat modeling
threatModelPrompts:
- What can a 100 percent quiz fail to prove about tenant isolation?
- What residual remains if Git/SQL/HTTP gaps are real?
- What residual remains if 1.4 accessibility is skipped with Phase 1?
concepts:
- quiz-not-1-2
- tooling-bridge
- gate-1-evidence
- credential-not-diagnostic
- securecollab
- seven-step-loop
learningObjects:
- id: 0.2-LO-01
  kind: concept-model
  title: A diagnostic score cannot satisfy Gate 1's evidence requirement
  path: lessons/01-property.md
- id: 0.2-LO-02
  kind: design-exercise
  title: A credential is not a diagnostic, and a syllabus is not a work role
  path: lessons/02-model.md
- id: 0.2-LO-03
  kind: mechanism-lab
  title: 'Local fixture: three placement decisions fail for three related reasons'
  path: lessons/03-break.md
- id: 0.2-LO-04
  kind: design-exercise
  title: Required and bridge are two different sets, computed by two different rules
  path: lessons/04-build.md
- id: 0.2-LO-05
  kind: verification-lab
  title: A green suite proves the deny fired, not that placement is fair
  path: lessons/05-verify.md
- id: 0.2-LO-06
  kind: operations-exercise
  title: A denial that leaks the thing it denies is not a fix
  path: lessons/06-operate.md
- id: 0.2-LO-07
  kind: transfer-challenge
  title: 'Transfer: a clinic''s onboarding quiz, and a vendor''s certificate'
  path: lessons/07-transfer.md
- id: 0.2-LO-08
  kind: code-review
  title: Review a placement-diagnostic change before it merges
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 0.2-bridge
  summary: A quiz score, a credential claim, or a fast-track flag used as authorization
    to skip 1.2/1.3/1.4 or Gate 1
  forbiddenOutcomes:
  - Quiz score used as authorization to skip 1.2/1.3/1.4/Gate 1
  - A job title, vendor certification, or LMS badge used as tooling-diagnostic evidence
  - An adaptive path that drops module 1.4 from a fast learner's required set
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Diagnostic repository and individualized path
- Transfer task prompt
- Local lab brief with quiz-skip, credential-skip, and required-set-drop deny tests
assessmentBlueprint:
  explain: A score, a credential, and a work-role description are each a different
    kind of evidence than a reviewed 1.2/1.3/1.4 artifact
  design: Tooling-bridge evidence standard vs 1.2/1.3/1.4 evidence; required vs
    bridge as two different sets
  build: quiz_score_grants_phase1_skip is false, tooling_bridge_required reads only
    diagnostic_gap, and required always contains 1.2/1.3/1.4, in labs/0.2/0.2-bridge/fixed
  break: Authorized local score-as-skip, credential-as-evidence, and required-set-drop
    failures
  verify: Forbidden-outcome, boundary, malformed, and anti-fake tests for all three
    functions
  operate: phase1_skip_denied without item text, answer content, or a badge image;
    audit skipped-module lists
  communicate: Residual Git/SQL/HTTP gaps still need bridges; a real Gate 1 evidence
    review is owned by 1.2-1.4, not this diagnostic
masteryGate: '0'
standardsRefs:
- source: NIST SP 800-181 Rev. 1 NICE Workforce Framework
  version: '800-181r1'
  status: final
  requirementIds:
  - secure-systems-development-work-role
  url: https://csrc.nist.gov/pubs/sp/800/181/r1/final
- source: NIST Cybersecurity Framework
  version: '2.0'
  status: final
  requirementIds:
  - GV
  url: https://www.nist.gov/publications/nist-cybersecurity-framework-csf-20
- source: W3C Web Content Accessibility Guidelines
  version: '2.2'
  status: final
  requirementIds:
  - '1.4.1'
  url: https://www.w3.org/TR/WCAG22/
misconceptions:
- Placement is a security clearance
- Fast learners skip invariants
- Tool fluency is threat modeling
- LMS percentage is Gate 1 evidence
- A job title or vendor certification is diagnostic evidence
operationalConsiderations:
- Audit skipped-module list on each cohort export.
- Bridge units still needed for Git/SQL/HTTP gaps — those skips are OK when the
  diagnostic itself, not a credential, shows the gap.
- A phase1_skip_denied signal must never carry quiz item text, answer content, or
  a badge image.
