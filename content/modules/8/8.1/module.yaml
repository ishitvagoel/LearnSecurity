id: '8.1'
slug: the-hostile-client-and-mobile-platform-model
title: The hostile-client and mobile-platform model
phase: 8
track: mobile
difficulty: advanced
status: reviewed
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 1.2 server cells; 7.1 client documents are untrusted
routeTags:
- complete
- mobile
releaseMilestone: M3
outcomes:
- 'Treat the Android client as hostile: a JSON integrity=ok field must not authorize export.'
- 'Draw a client/server responsibility matrix so 1.2 stays on the server; Play Integrity is a signal, not a grant.'
- 'Map MASVS 2.1 PLATFORM (not obsolete L1/L2/R) and keep resilience/attestation as cost-raising residuals.'
reviewTriggers:
- New client-side feature flag, premium bit, or integrity boolean used in a server decision
- Play Integrity / app-attest wired into an export or share path
- Minimum supported OS change that moves a sandbox assumption
- Superseding final MASVS or Android security model
invariants:
- allow_export with client integrity=ok and failing server attest is false
- The APK is outside the TCB for authorization
- Labs stay in authorized local or official training scope
- MASVS L1/L2/R are not used as current levels
threatModelPrompts:
- What can go wrong when policy runs on the attacker CPU?
- Which 1.1 cells still belong on the server after an Android client appears?
- What residual remains if Play Integrity passes on an emulator farm?
concepts:
- hostile-client
- attestation
- masvs-platform
- securecollab
- seven-step-loop
