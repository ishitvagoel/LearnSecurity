labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 8.1-lab
  summary: Client integrity claim authorizes export because policy runs on the client
  forbiddenOutcomes:
  - Client integrity claim authorizes export
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Client/server responsibility matrix
- Transfer task prompt
- Local lab brief with client-claim deny tests
assessmentBlueprint:
  explain: Hostile client; APK is not TCB; server attest is the export gate
  design: Responsibility matrix for each 1.1 cell
  build: allow_export uses server_attest only in labs/8.1/8.1-lab/fixed
  break: Authorized local client integrity=ok with failing attest
  verify: Forbidden-outcome tests plus honest server pass
  operate: attest_fail_export_denied without bodies
  communicate: Residual Play Integrity farms; honest rooted devices as product policy
masteryGate: '8'
standardsRefs:
- source: OWASP MASVS
  version: '2.1.0'
  status: final
  requirementIds:
  - MASVS-PLATFORM
  - MASVS-RESILIENCE-1
  url: https://mas.owasp.org/MASVS/
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
