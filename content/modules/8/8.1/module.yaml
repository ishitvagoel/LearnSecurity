  - v5.0.0-8.3.1
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: OWASP Mobile Top 10
  version: '2024'
  status: awareness
  requirementIds:
  - M7
  url: https://owasp.org/www-project-mobile-top-10/
misconceptions:
- Obfuscation is authorization
- If we use Kotlin we are safe
- Store listing equals device trust
- Play Integrity is 1.2
- MASVS L1/L2/R are current levels
operationalConsiderations:
- attest_fail_export_denied.
- Honest users on rooted devices — owned product policy, not a silent export grant.
