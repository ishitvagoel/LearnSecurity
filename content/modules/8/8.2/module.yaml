id: '8.2'
slug: local-data-keys-biometrics-offline-state-and-leakage-surfaces
title: Local data, keys, biometrics, offline state, and leakage surfaces
phase: 8
track: mobile
difficulty: advanced
status: reviewed
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 5.2 AEAD properties; 8.1 hostile client; 4.2 local auth is not server auth
routeTags:
- complete
- mobile
releaseMilestone: M3
outcomes:
- 'Refuse plaintext note bodies on disk; private app directories are not encryption.'
- 'Distinguish biometric gating of the UI from server authentication and from Keystore-held keys.'
- 'Inventory backups, screenshots, clipboard, notifications, and offline caches as extra leakage channels.'
reviewTriggers:
- New Room/SQLite file, cache, or WorkManager payload that stores bodies
- Backup flag, screenshot allow, or notification that includes a note
- Biometric prompt added as if it were 4.2 server MFA
- Superseding final MASVS
invariants:
- After save_note('secret'), plaintext_on_disk is false
- Biometric lock is not server authentication
- Labs stay in authorized local or official training scope
- Lab AEAD prefix is a stand-in, not a real cipher
threatModelPrompts:
- What can go wrong when bodies are written as text files?
- Which stores survive logout, backup, and a lost unlocked device?
- What residual remains if biometrics gate the UI but not the key?
concepts:
- masvs-storage
- keystore
- offline-cache
- securecollab
- seven-step-loop
