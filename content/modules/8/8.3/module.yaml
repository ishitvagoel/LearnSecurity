id: '8.3'
slug: network-deep-links-webviews-and-inter-app-communication
title: Network, deep links, WebViews, and inter-app communication
phase: 8
track: mobile
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 8.1 hostile client; 4.5 native OAuth; 2.1 untrusted query strings
routeTags:
- complete
- mobile
releaseMilestone: M3
outcomes:
- 'Refuse identity switches from deep-link query parameters; the session is identity and the Intent is untrusted input.'
- 'Treat exported components, custom schemes, and WebView bridges as attack surface, not private APIs.'
- 'Map MASVS 2.1 PLATFORM/NETWORK/AUTH and RFC 8252 claimed HTTPS redirects; keep verified App Links as still carrying query strings.'
reviewTriggers:
- New exported Activity, custom scheme, or App Link
- WebView JavaScript bridge or local HTTP server
- Native OAuth redirect (4.5 / RFC 8252)
- Superseding final MASVS
invariants:
- 'open_link as=admin leaves current_user alice'
- Intents and query strings are untrusted
- Labs stay in authorized local or official training scope
- MASVS L1/L2/R are not used as current levels
threatModelPrompts:
- What can go wrong when extras['as'] becomes the session?
- What residual remains if App Links are verified but query strings still bind?
- What residual remains if a WebView bridge exposes export?
concepts:
- deeplink
- ipc
- webview
- securecollab
- seven-step-loop
