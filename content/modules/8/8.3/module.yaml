labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 8.3-lab
  summary: Deep link as= switches the signed-in user
  forbiddenOutcomes:
  - Deep link as= switches the signed-in user
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Malicious-app/link harness notes and IPC review
- Transfer task prompt
- Local lab brief with as= deny tests
assessmentBlueprint:
  explain: Intent vs session; App Links still carry query strings
  design: Exported component inventory
  build: open_link ignores as= in labs/8.3/8.3-lab/fixed
  break: Authorized local as=admin switch
  verify: Forbidden-outcome tests plus honest note deep link
  operate: deeplink_identity_ignored without the full URL
  communicate: Residual custom-scheme hijack, WebView bridge, RFC 8252
masteryGate: '8'
standardsRefs:
- source: OWASP MASVS
  version: '2.1.0'
  status: final
  requirementIds:
  - MASVS-PLATFORM-1
  - MASVS-PLATFORM-2
  - MASVS-NETWORK-1
  - MASVS-AUTH-1
  url: https://mas.owasp.org/MASVS/
- source: IETF RFC 8252 OAuth 2.0 for Native Apps
  version: RFC 8252
  status: final
  requirementIds:
  - claimed-https-redirect
  url: https://datatracker.ietf.org/doc/html/rfc8252
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-8.3.1
  url: https://owasp.org/www-project-application-security-verification-standard/
misconceptions:
- HTTPS App Links are trusted input
- WebView is just Chrome so 2.3 applies unchanged
- IPC is private to our app
- exported=false is the default on every API level
operationalConsiderations:
- deeplink_identity_ignored.
- User installs attacker app — OS model residual.
