  requirementIds:
  - Mobile-Top-10-2024-awareness
  url: https://owasp.org/www-project-mobile-top-10/
misconceptions:
- Store privacy labels are controls
- Debug logs stay on device
- MASTG is a scanner
- Play Data safety redacts crash bodies
operationalConsiderations:
- crash_body_redacted.
- Vendor as processor — contract plus 5.1 purge.
