id: '8.5'
slug: mobile-verification-and-privacy
title: Mobile verification and privacy
phase: 8
track: mobile
difficulty: advanced
status: reviewed
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 8.1 hostile client; 3.1 log bodies; 5.1 extra copies
routeTags:
- complete
- mobile
releaseMilestone: M3
outcomes:
- 'Refuse crash reports that include a SecureCollab note body; Play Data safety is disclosure, not redaction.'
- 'Treat telemetry vendors and tracker SDKs as 3.1 / 5.1 sinks, not as trusted on-device storage.'
- 'Map MASVS 2.1 PRIVACY-1 through PRIVACY-4 and keep MAS Testing Profiles in MASTG, not obsolete MASVS L1/L2/R.'
reviewTriggers:
- Crash SDK includes note bodies or screenshots of notes
- Tracker SDK ships without a processor review
- Play Data safety form offered as the redaction control
- Superseding final MASVS
invariants:
- crash_report must not include the note body
- Play Data safety is disclosure, not redaction
- Labs stay in authorized local or official training scope
- MASVS L1/L2/R are not used as current levels
threatModelPrompts:
- What can go wrong when an exception message includes the note body?
- What residual remains if Play Data safety is filled in but crash JSON still has the body?
- What residual remains if the crash vendor is an honest processor (5.1)?
concepts:
- telemetry-sink
- masvs-privacy
- crash-redaction
- securecollab
- seven-step-loop
learningObjects:
- id: 8.5-LO-01
  kind: concept-model
  title: A crash report must not include the note body
  path: lessons/01-property.md
- id: 8.5-LO-02
  kind: design-exercise
  title: Telemetry is a 3.1 and 5.1 sink
  path: lessons/02-model.md
- id: 8.5-LO-03
  kind: mechanism-lab
  title: 'Local fixture: crash JSON contains the note body'
  path: lessons/03-break.md
- id: 8.5-LO-04
  kind: design-exercise
  title: Redact before send; do not trust the SDK default
  path: lessons/04-build.md
- id: 8.5-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for crash bodies
  path: lessons/05-verify.md
- id: 8.5-LO-06
  kind: operations-exercise
  title: crash_body_redacted without logging the body
  path: lessons/06-operate.md
- id: 8.5-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic crash with a synthetic patient name'
  path: lessons/07-transfer.md
- id: 8.5-LO-08
  kind: code-review
  title: Review crash_report that includes the body as a PR
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 8.5-lab
  summary: Crash report contains the note body
  forbiddenOutcomes:
  - Crash report contains the note body
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Mobile verification report and MASVS-PRIVACY traceability
- Transfer task prompt
- Local lab brief with crash-body deny tests
assessmentBlueprint:
  explain: Crash JSON must omit note bodies; Play Data safety is disclosure
  design: Telemetry vendor and tracker SDK as extra processors
  build: crash_report redacts the body in labs/8.5/8.5-lab/fixed
  break: Authorized local report that includes the body
  verify: Forbidden-outcome tests plus honest stack-present crash
  operate: crash_body_redacted without the body
  communicate: Residual vendor-as-processor; screenshots; ANR traces
masteryGate: '8'
