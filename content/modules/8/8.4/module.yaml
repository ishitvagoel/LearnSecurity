id: '8.4'
slug: build-distribution-attestation-and-resilience
title: Build, distribution, attestation, and resilience
phase: 8
track: mobile
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 8.1 hostile client; 5.3 secrets not in artifacts
routeTags:
- complete
- mobile
releaseMilestone: M3
outcomes:
- 'Refuse debug builds calling the production export API even when a client attest string is present.'
- 'Treat obfuscation, root detection, and Play Integrity as cost-raising, not as trust of the APK.'
- 'Map MASVS 2.1 CODE/RESILIENCE and keep signing-key leakage as a 5.3 residual; MAS Testing Profiles are not obsolete MASVS L1/L2/R.'
reviewTriggers:
- Shared API identifier between debug and release
- Signing key in the repo or CI
- Resilience checklist offered as Gate 8 evidence
- Superseding final MASVS
invariants:
- api_allowed('debug', 'ok') is false
- Resilience raises cost; it does not authorize
- Labs stay in authorized local or official training scope
- MASVS L1/L2/R are not used as current levels
threatModelPrompts:
- What can go wrong when prod trusts attest=ok from any build type?
- What residual remains if R8 is on but the debug client id still works?
- What residual remains if signing keys leak (5.3)?
concepts:
- release-channel
- masvs-resilience
- signing
- securecollab
- seven-step-loop
learningObjects:
- id: 8.4-LO-01
  kind: concept-model
  title: Resilience raises cost; it is not trust
  path: lessons/01-property.md
