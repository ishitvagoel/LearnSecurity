  path: lessons/04-build.md
- id: 8.4-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for debug
  path: lessons/05-verify.md
- id: 8.4-LO-06
  kind: operations-exercise
  title: debug_to_prod_denied without logging the APK
  path: lessons/06-operate.md
- id: 8.4-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic debug build against prod FHIR'
  path: lessons/07-transfer.md
- id: 8.4-LO-08
  kind: code-review
  title: Review always-true api_allowed as a PR, not an R8 sticker
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 8.4-lab
  summary: Debug build allowed to call production export
  forbiddenOutcomes:
  - Debug build allowed to call production export
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Signed release evidence notes and resilience limitations
- Transfer task prompt
- Local lab brief with debug-to-prod deny tests
assessmentBlueprint:
  explain: Build type plus attest on the server; resilience is cost
  design: Separate client ids; signing-key ownership
  build: api_allowed requires release and ok in labs/8.4/8.4-lab/fixed
  break: Authorized local always-true allow
  verify: Forbidden-outcome tests plus honest release plus attest
  operate: debug_to_prod_denied without the binary
  communicate: Residual attestation farms; key leak 5.3; MAS-R profile is not 1.2
masteryGate: '8'
standardsRefs:
- source: OWASP MASVS
  version: '2.1.0'
  status: final
  requirementIds:
  - MASVS-CODE
  - MASVS-RESILIENCE-1
  - MASVS-RESILIENCE-2
  url: https://mas.owasp.org/MASVS/
- source: OWASP MASTG
  version: '2.0.0'
  status: final
  requirementIds:
  - MAS-testing-profiles
  url: https://mas.owasp.org/MASTG/0x03b-Testing-Profiles/
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-13.3.1
  - v5.0.0-8.3.1
  url: https://owasp.org/www-project-application-security-verification-standard/
misconceptions:
- Obfuscation equals security
- Play App Signing means we do not care
- Anti-debug proves the server can trust the client
- MASVS R-level is a current MASVS verification level
operationalConsiderations:
- debug_to_prod_denied.
- Attestation farms; revoke debug client ids.
