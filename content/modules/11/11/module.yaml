labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 11-lab
  summary: Revoked share still reads the note
  forbiddenOutcomes:
  - Revoked share still reads the note
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Local revoke-after-share tests plus a named portable portfolio
- Transfer task prompt
- Local lab brief
assessmentBlueprint:
  explain: Revoke is 1.2 over time; a scanner is not the pack
  design: Owner, grant, cache, worker, leftover copies
  build: read consults owner-or-grant in labs/11/11-lab/fixed
  break: Authorized local no-op revoke
  verify: Forbidden-outcome tests plus honest owner and pre-revoke share
  operate: revoked_share_read_denied without bodies
  communicate: Residual copies already sent; delayed worker; device cache
masteryGate: '11'
standardsRefs:
