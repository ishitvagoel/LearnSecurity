id: '11'
slug: integrating-capstone-securecollab
title: Integrating capstone — SecureCollab
phase: 11
track: capstone
difficulty: capstone
status: reviewed
estimatedMinutes: 1200
prerequisites:
- 'Prior phase Pass A per blueprint §7; 1.2 mediation; 2.4 time; 4.4 isolation; 7.4 workers'
routeTags:
- complete
- web-api
releaseMilestone: M5
outcomes:
- 'Refuse a read after revoke; a green scanner is not the portfolio.'
- 'Treat revoke as complete mediation on the next read, not as a one-shot event.'
- 'Name leftover copies, caches, and delayed workers as residuals without claiming Gate 11.'
reviewTriggers:
- Read after revoke succeeds
- Capstone README treats scanner green as done
- No cache invalidation
- Gate 11 claimed without artifacts
invariants:
- read after revoke for tenant B is None
- Labs stay in authorized local or official training scope
- A scanner is not application 1.2
- Gate 11 and M5 stay not-attempted without learner evidence
threatModelPrompts:
- What can a former collaborator do with a cached note id?
- What residual remains if a delayed worker still holds a user session?
- What residual remains if B already exported the body?
concepts:
- revoke-is-mediation
- portfolio-not-scanner
- complete-mediation-over-time
- securecollab
- seven-step-loop
