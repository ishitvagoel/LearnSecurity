id: '2.1'
slug: bytes-text-formats-parsers-interpreters
title: Bytes, text, formats, parsers, and interpreters
phase: 2
track: core
difficulty: foundation
status: reviewed
estimatedMinutes: 270
prerequisites:
- 1.1–1.4 Pass A
routeTags:
- complete
- accelerated
- web-api
- mobile
releaseMilestone: M0
outcomes:
- Produce a parser-boundary map for the SecureCollab request path
- Explain bytes vs characters, Unicode, canonicalization, encodings, grammars, serialization,
  interpreter boundaries
- Demonstrate a local parser differential as a property failure
- Separate validation, canonicalization, sanitization, and encoding by context
- Transfer the map when a new format is added
reviewTriggers:
- New serializer, template engine, or query builder
- Unicode normalization or default encoding change
invariants:
- Each interpreter boundary on the scoped path is named
- Disagreeing parsers are treated as an invariant failure
- No live-target encoding attacks or lesson-page weaponized payloads
threatModelPrompts:
- Where can an attacker choose encoding, BOM, or nested format?
- Which shared parser is a least-common-mechanism risk?
concepts:
- bytes-versus-characters
- unicode-normalization
- canonicalization
- parser-differential
- interpreter-boundary
- serialization
