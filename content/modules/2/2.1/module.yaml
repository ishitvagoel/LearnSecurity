- date: '2026-09-16'
  note: 'Deepen (D1-D14 remediation, B0 pilot): named five teaching claims (C1-C5)
    and a coverage contract in spec.md; expanded all eight lessons to clear the
    900-word floor with derivation, worked examples, and counterexamples rather
    than padding; added Standards lines to 01-property.md (ASVS V1.1.1/V2.2.1/
    V2.2.2/V1.5.3, RFC 8259 SS4) and 05-verify.md. Raised the lab from two tests
    to six: reading the vulnerable checker closely surfaced a second, quieter
    defect past the documented first-vs-last disagreement -- comparing only the
    first and last occurrence of a duplicate key misses a middle value that
    disagrees while the endpoints coincide, so the fixed reader now collects
    every occurrence via re.findall and requires the full set to have exactly
    one value. Added a boundary test for that gap, a malformed-input test (no
    tenant field), and a two-test anti-fake pair verified against a constructed
    fake that special-cases the exact AMBIGUOUS/CLEAN constants. Authored a
    nine-item assessment bank with distractor rationales and four-state banding
    in the isolated key; rewrote the rubric to remove the non-existent "session
    worksheet" reference and to point the seeded review at a checklist rather
    than a pre-stated list of findings. Corrected reviewer/lastReviewedAt/
    nextReviewAt, which claimed a completed review with no artifact under
    content/progress/reviews/ (the same D12 pattern found and fixed on 1.4);
    reverted to pending with null dates per metadata-honesty.mdc. Independent
    review requested; this pass may not and does not set depth or quality.'
- date: '2026-09-16'
  note: 'Closed nine blockers from the independent review at content/progress/
    reviews/2.1-2026-09-16.md, three substantive: (1) ASVS citations were
    misassigned across four requirements, including the one (V1.5.3) that
    states this module''s own property; verified the correct text against the
    official ASVS 5.0.0 release and rewrote both Standards lines. (2) The
    GraphQL transfer claims were technically wrong -- variables are coerced
    once per operation and cannot disagree with themselves via aliasing, as
    the module previously claimed; verified against the GraphQL spec and
    rewrote every affected passage (07-transfer.md, 03-break.md, 05-verify.md,
    items.md #8, the key''s banding, rubric.md) around the correct mechanism,
    duplicate keys inside the variables JSON payload itself. (3) The "fixed"
    reader''s own re.findall-based fix (added in the prior entry) had a real
    gap: a regex matching only quoted-string values cannot see a non-string
    duplicate occurrence, confirmed by hand with {"tenant":1,"tenant":"tA"}
    silently accepted. Replaced it with json.loads''s own object_pairs_hook,
    which asks the real parser for every occurrence instead of approximating
    it with a second regex; added a regression test for the non-string case
    and a malformed-JSON-syntax test, fixing an unhandled JSONDecodeError in
    both variants along the way -- the lab is now 8 tests, not 6. The six
    bookkeeping blockers closed alongside: corrected four wrong item-outcome
    citations in spec.md''s coverage contract, added RFC 8259 to pins.yaml,
    fixed a stale "two of six" count, moved a design item out of the
    retryable rubric bucket, and added an isolated seeded-review findings
    section the rubric already pointed at but the key never had -- 08-review.md
    itself still pre-stated its answer above the checklist despite the prior
    entry''s claim to have fixed this; removed that sentence. Requesting the
    limited re-review the prior artifact recommended.'
