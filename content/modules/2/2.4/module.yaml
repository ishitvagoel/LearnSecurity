id: '2.4'
slug: state-time-concurrency-distributed-failure
title: State, time, concurrency, and distributed failure
phase: 2
track: core
difficulty: foundation
status: draft
estimatedMinutes: 330
prerequisites:
- 2.1 Pass A
- 2.2 Pass A
- 2.3 Pass A
- 1.2 Pass A
routeTags:
- complete
- accelerated
- web-api
- mobile
releaseMilestone: M0
outcomes:
- Given a share endpoint that accepts an idempotency key, state the property a retry
  must satisfy and name the check-then-act structure that still fails under real
  concurrent access even when it passes a sequential retry test
- Produce a state machine for the SecureCollab share workflow naming which transitions
  a retry, a race, and a key-store failure each take
- On the local FastAPI/SQLite fixture, show both a sequential retry and eight genuinely
  concurrent first-requests failing to duplicate a share
- On the same fixture, show the share endpoint denying rather than accepting a request
  when its idempotency store is unreachable
- Treat OWASP Top 10:2025 A10 as a regression check applied after the causal fix,
  not as the lesson's own structure
- Transfer the retry, race, and fail-closed reasoning to a different limited resource
  and state which claims survive the change unchanged and which do not
reviewTriggers:
- New async path
- Timeout or retry policy change
- Clock source change
- Idempotency-store or database technology change
invariants:
- Retries and concurrent first-requests do not duplicate a non-idempotent side effect
  in the scoped share workflow
- The share endpoint fails closed (denies, does not insert) when its idempotency
  store is unreachable
- No load-testing of third-party APIs; the lab fixture is local only
threatModelPrompts:
- What happens on retry, timeout, or partial commit?
- Whose clock is trusted for freshness?
- Can authorization become stale between check and use?
- Can two requests that each look like the first request actually be in flight at
  the same time?
concepts:
- idempotency
- replay
- toctou
- race
- check-then-act
- partial-failure
- fail-closed
- exceptional-conditions
learningObjects:
- id: 2.4-LO-01
  kind: concept-model
  title: A retry is a second attempt, not a second grant
  path: lessons/01-property.md
- id: 2.4-LO-02
  kind: design-exercise
  title: A share state machine that names retry, race, and store failure
  path: lessons/02-model.md
- id: 2.4-LO-03
  kind: mechanism-lab
  title: 'Local fixture: a retry duplicates a share on a real request cycle'
  path: lessons/03-break.md
- id: 2.4-LO-04
  kind: design-exercise
  title: Push the check into the store; do not check-then-act in the handler
  path: lessons/04-build.md
- id: 2.4-LO-05
  kind: verification-lab
  title: A test that holds eight requests in flight, not two in sequence
  path: lessons/05-verify.md
- id: 2.4-LO-06
  kind: operations-exercise
  title: Detect a replay or a race; never fail open the key store
  path: lessons/06-operate.md
- id: 2.4-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic last slot, payment capture, or invite token'
  path: lessons/07-transfer.md
- id: 2.4-LO-08
  kind: code-review
  title: Seeded review of a check-then-insert share fix
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local FastAPI/SQLite course fixture only; no public or third-party
    targets, no live load testing
  slug: 2.4-state-time
  summary: A retry, or a genuine concurrent race, creates a second share grant; the
    store must fail closed, not fail open, when it cannot be reached
  forbiddenOutcomes:
  - Retry creates a second share grant
  - Concurrent first-requests for the same never-seen key create a second share grant
  - The share endpoint reports success while the store is unreachable and nothing
    was recorded
  - Live-target instructions
  - Real PII or production secrets
evidenceRequired:
- State-machine model naming retry, race, and store-failure transitions
- Concurrency and replay test list, including a genuinely concurrent case
- Fail-closed timeout/store-failure decision, tested on the fixture
assessmentBlueprint:
  explain: Retry vs race vs store failure as three distinct forbidden outcomes
  design: Share workflow state machine
  build: Idempotency key enforced by a database uniqueness constraint; fail-closed
    store-failure path
  break: Local duplicate-submit fixture on a real FastAPI/SQLite request cycle
  verify: Sequential-retry, concurrent-race, and fail-closed tests, plus an anti-fake
    pair
  operate: Exceptional-condition logging without fail-open
  communicate: A10 is awareness regression, not the lesson structure
masteryGate: '2'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-2.3.3
  - v5.0.0-2.3.4
  - v5.0.0-15.4.1
  - v5.0.0-15.4.2
  - v5.0.0-15.4.3
  - v5.0.0-16.5.2
  - v5.0.0-16.5.3
  url: https://asvs.owasp.org
- source: IETF RFC 9110 HTTP Semantics
  version: RFC 9110
  status: final
  requirementIds:
  - post-not-idempotent
  url: https://datatracker.ietf.org/doc/html/rfc9110
- source: OWASP Top 10
  version: '2025'
  status: awareness
  requirementIds:
  - A10
  url: https://owasp.org/Top10/2025/
misconceptions:
- Retries are a client bug, not ours
- HTTP 200 (or 201) means it happened once
- Databases are automatically idempotent
- A sequential retry test proves the concurrent case is safe too
operationalConsiderations:
- share_count vs unique keys; never fail-open if the key store is down.
- Circuit-break or degrade gracefully when the store is slow or unreachable (ASVS
  v5.0.0-16.5.2), rather than blocking indefinitely or silently succeeding.
- Lost first response still needs a read-your-write path so the owner can see the
  existing share without minting another key.
