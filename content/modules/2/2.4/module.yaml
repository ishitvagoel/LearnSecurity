- date: '2026-09-23'
  note: 'Closed both blockers from the independent review at
    content/progress/reviews/2.4-2026-09-23.md. (1) The reviewer
    constructed a correctly module-level-shared threading.Lock() (built
    once, genuinely contended by every request in the process, unlike
    review/candidate_fix.py''s per-call lock) wrapping check-then-act
    with no database UNIQUE constraint, and it passed all 7 tests
    including the concurrency test -- because that test spawns eight
    threads inside one Python process, which structurally cannot
    distinguish "atomic because the database enforces it" from "atomic
    because a correctly-shared in-process lock enforces it." Standing up
    real cross-process concurrency (two OS processes against one on-disk
    database) was judged out of scope for this Tier-2 fixture, so per the
    review''s own offered alternative, honestly narrowed the claim instead:
    05-verify.md now states plainly that the lab''s concurrency test
    verifies atomicity within one process only, and that the cross-process
    half of C4 (a shared lock does nothing for a second uvicorn worker) is
    verified by argument, not by this suite -- the same pattern C5 already
    used correctly. spec.md''s C4 coverage-contract row states the same
    limit. (2) Re-derived every cell of the teaching-claims and
