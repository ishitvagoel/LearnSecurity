id: '2.4'
slug: state-time-concurrency-distributed-failure
title: State, time, concurrency, and distributed failure
phase: 2
track: core
difficulty: foundation
status: draft
estimatedMinutes: 330
prerequisites:
- 2.1 Pass A
- 2.2 Pass A
- 2.3 Pass A
- 1.2 Pass A
routeTags:
- complete
- accelerated
- web-api
