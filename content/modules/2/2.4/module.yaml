releaseMilestone: M0
outcomes:
- Model session state, replay, freshness, idempotency, ordering, retry, timeout, clocks, TOCTOU,
  races, and partial failure
- Produce a state-machine plus concurrency and replay test list
- Show a local retry or timeout that duplicates a side effect or fail-opens
- Treat Top 10:2025 A10 as awareness regression only
- Transfer after adding a worker retry with stale authorization
reviewTriggers:
- New async path
- Timeout or retry policy change
- Clock source change
invariants:
- Retries do not duplicate non-idempotent side effects in the scoped workflow
- Timeouts fail closed for authorization-relevant operations
- No load-testing of third-party APIs
threatModelPrompts:
- What happens on retry, timeout, or partial commit?
- Whose clock is trusted for freshness?
- Can authorization become stale between check and use?
concepts:
- idempotency
- replay
- toctou
- race
- partial-failure
- fail-closed
- exceptional-conditions
