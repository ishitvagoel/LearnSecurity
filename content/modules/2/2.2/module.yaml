id: '2.2'
slug: dns-transport-http-tls-proxies-cdns-caches
title: DNS, transport, HTTP, TLS, proxies, CDNs, and caches
phase: 2
track: core
difficulty: foundation
status: draft
estimatedMinutes: 300
prerequisites:
- 2.1 Pass A
- 1.3 Pass A
routeTags:
- complete
- accelerated
- web-api
releaseMilestone: M0
outcomes:
- Given SecureCollab's Phase 2 request-path fixture, identify every point where a
  shared cache or a forwarded-identity header could substitute a wrong company for
  the caller's own bound identity, and justify why each point does or does not
  actually let a wrong company through in the code as written
- State precisely what a successful TLS 1.3 handshake does and does not prove about
  a hop's peer, and name the additional checks (hostname match, trust state,
  accepted version) a deployment must add beyond "TLS is enabled"
- Produce a request-path diagram for SecureCollab's browser-edge-origin path that
  names, for each hop, which identity or name was authenticated and which was not,
  and states the cache-key policy that must hold at the shared store
- Given a new CDN or reverse proxy added to the path, predict which cache-key and
  forwarded-identity assumptions from this module change, and design the detection
  and recovery response if that boundary silently reverts them
reviewTriggers:
- New edge, CDN, HTTP/2-3, or mTLS
- Change to forwarded-identity trust
invariants:
- Origin does not treat unauthenticated forwarded headers as identity
- Cache keys are explicit and in the threat model
- A hop-authentication check requires a trusted CA, a matching hostname, and an
  accepted protocol version together, and fails closed on an unknown input
- No attacks against real CDNs or third-party sites
threatModelPrompts:
- Who authenticated the name, and to which hop?
- What is the cache key, and can an attacker influence it?
- After TLS termination, what identity is still bound to the request?
- Does a passing TLS handshake at one hop say anything about a hop after it?
concepts:
- dns
- tls-1.3
- http-hops
- forwarded-identity
- cache-key
- cdn-trust
learningObjects:
- id: 2.2-LO-01
  kind: concept-model
  title: A hop's certificate is not a company; a cache key is not a header
  path: lessons/01-property.md
- id: 2.2-LO-02
  kind: design-exercise
  title: Annotate every hop with what it authenticated, not what it encrypted
  path: lessons/02-model.md
- id: 2.2-LO-03
  kind: mechanism-lab
  title: 'Local fixture: a shared cache and a forwarded header both grant the wrong company'
  path: lessons/03-break.md
- id: 2.2-LO-04
  kind: design-exercise
  title: Bind the cache key, ignore the header, check the whole certificate
  path: lessons/04-build.md
- id: 2.2-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for cache keys, headers, and hop trust
  path: lessons/05-verify.md
- id: 2.2-LO-06
  kind: operations-exercise
  title: Detect a mismatched hit or a mismatched hop; purge and rotate without logging bodies
  path: lessons/06-operate.md
- id: 2.2-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic /patients/me on a shared CDN'
  path: lessons/07-transfer.md
- id: 2.2-LO-08
  kind: code-review
  title: Seeded review of a cache, a header, and a hop check that all stop too early
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture (FastAPI + TestClient) only; no public or
    third-party targets, no real TLS handshake, no DNS resolution
  slug: 2.2-request-path
  summary: Shared cache returns company A's body to company B; a client-supplied
    X-Company header overrides the caller's own bound company; a hop-authentication
    check accepts a CA-trusted certificate for the wrong hostname
  forbiddenOutcomes:
  - Shared cache returns company A's body to company B
  - A client-supplied forwarded-identity header changes which company's notes a
    caller may read
  - A hop-authentication check accepts a certificate whose hostname does not match
    the intended peer
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Request-path diagram naming, per hop, what was authenticated
- Hardened local edge notes distinguishing cache-key policy from forwarded-identity
  policy
- Origin verification tests list, including the anti-fake pair for each claim
assessmentBlueprint:
  explain: Hops and what a TLS handshake does and does not guarantee about a peer,
    after termination
  design: Request-path diagram with cache keys and per-hop authentication notes
  build: Origin resolves company only from the caller's own credential; cache keys
    bind that company; hop checks bind hostname, CA trust, and version together
  break: Local cache-key and forwarded-header rewrite annotated to the claim it
    breaks
  verify: Origin rejects unauthenticated forwarded identity and a mismatched hop
    certificate
  operate: Cache-mismatch and hop-rejection signals, and a certificate failure drill
  communicate: Residual trust after TLS termination and after adding a CDN
masteryGate: '2'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-4.1.3
  - v5.0.0-12.1.1
  - v5.0.0-12.2.1
  - v5.0.0-12.2.2
  - v5.0.0-12.3.2
  - v5.0.0-14.2.2
  - v5.0.0-14.3.2
  - v5.0.0-14.2.5
  - v5.0.0-16.3.4
  url: https://owasp.org/projects/asvs
- source: IETF RFC 9110 HTTP Semantics
  version: RFC 9110
  status: final
  requirementIds:
  - cacheability
  - vary
  url: https://datatracker.ietf.org/doc/html/rfc9110
- source: IETF RFC 9846 TLS 1.3
  version: RFC 9846
  status: final
  requirementIds:
  - tls-1.3-hop-authenticity
  url: https://datatracker.ietf.org/doc/html/rfc9846
misconceptions:
- HTTPS means no cache bugs
- CDNs are only a performance layer
- 'Vary: Cookie is enough forever'
- A certificate that chains to a trusted CA proves the hop reached the intended
  host, without checking the certificate's hostname
- Once TLS has terminated at the edge, a client-supplied X-Forwarded-* or
  X-Company header is safe for the origin to trust as identity
operationalConsiderations:
- cdn_hit_company_mismatch; purge playbook.
- hop_rejected reason=hostname_mismatch|version|untrusted; certificate failure
  drill, never logging the body or the private key.
- Operational error at the CDN or edge remains; monitor.
