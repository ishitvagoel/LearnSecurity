  path: lessons/04-build.md
- id: 2.2-LO-05
  kind: verification-lab
  title: Fail-on-vulnerable then pass-on-fixed for cache keys
  path: lessons/05-verify.md
- id: 2.2-LO-06
  kind: operations-exercise
  title: Detect mismatched hits; purge without logging the body
  path: lessons/06-operate.md
- id: 2.2-LO-07
  kind: transfer-challenge
  title: 'Transfer: clinic /patients/me on a shared CDN'
  path: lessons/07-transfer.md
- id: 2.2-LO-08
  kind: code-review
  title: Seeded review of path-only cache keys
  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 2.2-request-path
  summary: Shared cache returns tenant A's body to tenant B
  forbiddenOutcomes:
  - Shared cache returns tenant A's body to tenant B
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Request-path diagram
- Hardened local edge notes
- Origin verification tests list
assessmentBlueprint:
  explain: Hops and what TLS does and does not guarantee after termination
  design: Request-path diagram with cache keys
  build: Deferred; origin verification of forwarded identity
  break: Local Host or cache-key rewrite annotation
  verify: Origin rejects unauthenticated forwarded identity
  operate: Certificate failure drill notes
  communicate: Residual trust after TLS termination
masteryGate: '2'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-4.1.3
  - v5.0.0-12.2.1
  - v5.0.0-14.2.2
  - v5.0.0-14.3.2
  - v5.0.0-14.2.5
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: IETF RFC 9110 HTTP Semantics
  version: RFC 9110
  status: final
  requirementIds:
  - cacheability
  - vary
  url: https://datatracker.ietf.org/doc/html/rfc9110
- source: IETF RFC 9846 TLS 1.3
  version: RFC 9846
  status: final
  requirementIds:
  - tls-1.3-hop-authenticity
  url: https://datatracker.ietf.org/doc/html/rfc9846
misconceptions:
- HTTPS means no cache bugs
- CDNs are only a performance layer
- 'Vary: Cookie is enough forever'
operationalConsiderations:
- cdn_hit_tenant_mismatch; purge playbook.
- Operational error at the CDN remains; monitor.
