id: '2.2'
slug: dns-transport-http-tls-proxies-cdns-caches
title: DNS, transport, HTTP, TLS, proxies, CDNs, and caches
phase: 2
track: core
difficulty: foundation
status: reviewed
estimatedMinutes: 300
prerequisites:
- 2.1 Pass A
- 1.3 Pass A
routeTags:
- complete
- accelerated
- web-api
releaseMilestone: M0
outcomes:
- Trace a request end to end and mark where identity, scheme, host, headers, body,
  and cache keys can be transformed or trusted incorrectly
- State TLS 1.3 deployment responsibilities without treating HTTPS-on as the property
- Produce a request-path diagram and hardened local edge configuration notes
- Transfer after adding a CDN or reverse proxy
reviewTriggers:
- New edge, CDN, HTTP/2-3, or mTLS
- Change to forwarded-identity trust
invariants:
- Origin does not treat unauthenticated forwarded headers as identity
- Cache keys are explicit and in the threat model
- No attacks against real CDNs or third-party sites
threatModelPrompts:
- Who authenticated the name, and to which hop?
- What is the cache key, and can an attacker influence it?
- After TLS termination, what identity is still bound to the request?
concepts:
- dns
- tls-1.3
- http-hops
- forwarded-identity
- cache-key
- cdn-trust
learningObjects:
- id: 2.2-LO-01
  kind: concept-model
  title: TLS authenticates a hop; the cache key decides who reads
  path: lessons/01-property.md
- id: 2.2-LO-02
  kind: design-exercise
  title: Request-path map a second engineer can key
  path: lessons/02-model.md
- id: 2.2-LO-03
