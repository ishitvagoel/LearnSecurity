  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture reached through fastapi.testclient.TestClient
    only; no public or third-party targets
  slug: 2.3-browser-policy
  summary: A script-readable session cookie and a reflected-origin CORS grant on
    SecureCollab's /login and /notes surface
  forbiddenOutcomes:
  - Script reads the HttpOnly session cookie
  - An arbitrary origin receives Access-Control-Allow-Credentials 'true'
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Browser policy matrix
- Header/cookie/CORS test list
- Draft-status labels on CSP3/Trusted Types
assessmentBlueprint:
  explain: Origin vs site; browser vs server enforcement
  design: Policy matrix
  build: Deferred; header and cookie policy
  break: Local reflected-origin and script-readable-cookie annotation
  verify: Header, cookie, and CORS tests
  operate: CSP report-only versus enforce; reflected-origin detection
  communicate: Why CSP is not a complete XSS guarantee, and why a reflected Origin
    is not a validated one
masteryGate: '2'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-3.3.4
  - v5.0.0-3.3.1
  - v5.0.0-3.3.2
  - v5.0.0-3.4.2
  - v5.0.0-3.4.3
  - v5.0.0-3.4.6
  url: https://owasp.org/projects/asvs
- source: W3C Content Security Policy Level 3
  version: Level 3
  status: draft
  requirementIds:
  - csp3
  url: https://www.w3.org/TR/CSP3/
- source: W3C Trusted Types
  version: WD
  status: draft
  requirementIds:
  - trusted-types
  url: https://www.w3.org/TR/trusted-types/
misconceptions:
- HttpOnly is XSS defense
- SameSite is CSRF complete
- localStorage is safer than cookies
- Access-Control-Allow-Origin can be validated by checking the hostname or domain
  instead of the full scheme+host+port origin
- Content-Security-Policy-Report-Only is "CSP is on"
operationalConsiderations:
- Set-Cookie without HttpOnly in staging scans.
- Access-Control-Allow-Origin reflecting the request's Origin together with Access-Control-Allow-Credentials
  'true' in staging scans.
- Browser extensions; physical access.
