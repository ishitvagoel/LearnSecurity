labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 2.3-browser-policy
  summary: Script reads the HttpOnly session cookie
  forbiddenOutcomes:
  - Script reads the HttpOnly session cookie
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Browser policy matrix
- Header/cookie test list
- Draft-status labels on CSP/TT
assessmentBlueprint:
  explain: Origin vs site; browser vs server enforcement
  design: Policy matrix
  build: Deferred; header and cookie policy
  break: Local cookie or CORS confusion annotation
  verify: Header and cookie tests
  operate: CSP report-only versus enforce
  communicate: Why CSP is not a complete XSS guarantee
masteryGate: '2'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: 5.0.0
  status: final
  requirementIds:
  - V3
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: W3C Content Security Policy Level 3
  version: Level 3
  status: draft
  requirementIds:
  - csp3
  url: https://www.w3.org/TR/CSP3/
- source: W3C Trusted Types
  version: WD
  status: draft
  requirementIds:
  - trusted-types
  url: https://www.w3.org/TR/trusted-types/
misconceptions:
- HttpOnly is XSS defense
- SameSite is CSRF complete
- localStorage is safer than cookies
operationalConsiderations:
- Set-Cookie without HttpOnly in staging scans.
- Browser extensions; physical access.
