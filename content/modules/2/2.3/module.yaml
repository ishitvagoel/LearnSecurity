id: '2.3'
slug: browser-security-model
title: Browser security model
phase: 2
track: core
difficulty: foundation
status: draft
estimatedMinutes: 330
prerequisites:
- 2.1 Pass A
- 2.2 Pass A
- 1.2 Pass A
- 1.3 Pass A
routeTags:
- complete
- accelerated
- web-api
releaseMilestone: M0
outcomes:
- Given the vulnerable and fixed variants of labs/2.3/2.3-browser-policy, identify
  by exact response-header name and value which of Set-Cookie, Access-Control-Allow-Origin,
  Access-Control-Allow-Credentials, and Content-Security-Policy (or -Report-Only)
  a browser treats as an enforceable guarantee versus a detection-only signal, and
  justify each answer against OWASP ASVS 5.0.0 V3
- Produce a browser policy matrix for SecureCollab's /login and /notes surface --
  origin vs site, cookie flags, CORS, CSP, frame-ancestors -- that names, for every
  row, whether the browser or the server enforces it and what happens when the row
  is absent
- Given a caller's Origin header and SecureCollab's exact-origin allow-list, determine
  whether that caller is the same origin, the same site, or neither, and predict
  the exact Access-Control-Allow-Origin and Access-Control-Allow-Credentials response
  each variant of the lab would produce
- Given a new reader of sc_session (a third-party iframe or a WebView cookie bridge),
  rebuild this module's policy rows for that reader without assuming any row from
  the first-party page carries over unchanged
reviewTriggers:
- New cookie policy
- Third-party script or iframe
- CORS allow-list change
- CSP/Trusted Types deployment change
invariants:
- Browser-enforced controls are not treated as application guarantees
- 'Access-Control-Allow-Credentials: true never pairs with an Access-Control-Allow-Origin
  that was not validated against a fixed allow-list'
- Draft standards are labeled draft
- No instructions to attack third-party sites via CORS or CSRF
threatModelPrompts:
- Who has DOM authority after navigation or postMessage?
- Which cookie is readable to script, and on which site vs origin?
- Which caller's Origin header would this allow-list accept, and is that caller
  who it claims to be?
- If CSP is bypassed, what server control remains?
concepts:
- origin
- site
- cors
- credentialed-cors
- cookies
- csp
- frame-ancestors
- trusted-types
- sri
- fetch-metadata
- cross-origin-isolation
learningObjects:
- id: 2.3-LO-01
  kind: concept-model
  title: The browser enforces some rules; the server enforces the rest
  path: lessons/01-property.md
- id: 2.3-LO-02
  kind: design-exercise
  title: A browser policy matrix a second engineer can test
  path: lessons/02-model.md
- id: 2.3-LO-03
  kind: mechanism-lab
  title: 'Local fixture: a reflected origin and a script-readable session cookie'
  path: lessons/03-break.md
- id: 2.3-LO-04
  kind: design-exercise
  title: An exact allow-list, HttpOnly, and an enforcing CSP -- not three slogans
  path: lessons/04-build.md
- id: 2.3-LO-05
