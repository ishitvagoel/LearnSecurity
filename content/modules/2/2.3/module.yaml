id: '2.3'
slug: browser-security-model
title: Browser security model
phase: 2
track: core
difficulty: foundation
status: spec
estimatedMinutes: 300
prerequisites:
- 2.1 Pass A
- 2.2 Pass A
- 1.2 Pass A
- 1.3 Pass A
routeTags:
- complete
- accelerated
- web-api
releaseMilestone: M0
outcomes:
- Produce a browser policy matrix covering origin vs site, cookies, storage, frames,
  CORS, CSP, Trusted Types, SRI, and browser vs server enforcement
- Show a local fixture where a browser control is not an application guarantee
- Label CSP3 and Trusted Types as Working Drafts
- Transfer after adding a third-party script or iframe
reviewTriggers:
- New cookie policy
- Third-party script or iframe
- CSP/Trusted Types deployment change
invariants:
- Browser-enforced controls are not treated as application guarantees
- Draft standards are labeled draft
- No instructions to attack third-party sites via CORS or CSRF
threatModelPrompts:
- Who has DOM authority after navigation or postMessage?
- Which cookie is readable to script, and on which site vs origin?
- If CSP is bypassed, what server control remains?
concepts:
- origin
- site
- cors
- cookies
- csp
- trusted-types
- sri
- fetch-metadata
- cross-origin-isolation
learningObjects:
- id: 2.3-LO-01
  kind: concept-model
  title: Origin vs site; browser vs server enforcement
- id: 2.3-LO-02
  kind: design-exercise
  title: Browser policy matrix for SecureCollab web client
- id: 2.3-LO-03
  kind: mechanism-lab
  title: 'Local page: cookie, storage, or CORS confusion'
- id: 2.3-LO-04
  kind: design-exercise
  title: Header and cookie policy that matches the matrix; label draft standards
- id: 2.3-LO-05
  kind: verification-lab
  title: Header and cookie verification tests
- id: 2.3-LO-06
  kind: operations-exercise
  title: CSP report-only versus enforce; what to log
- id: 2.3-LO-07
  kind: transfer-challenge
  title: 'Add third-party widget: new origin and site rows'
- id: 2.3-LO-08
  kind: code-review
  title: Seeded CSP that is treated as XSS-complete
labSpec:
  authorizedScope: Local application origin only
  slug: 2.3-browser-policy
  summary: Browser policy matrix and local cookie/CORS fixture
  forbiddenOutcomes:
  - Driving attacks against other sites
  - Presenting CSP3 or Trusted Types as final Recommendations
evidenceRequired:
- Browser policy matrix
- Header/cookie test list
- Draft-status labels on CSP/TT
assessmentBlueprint:
  explain: Origin vs site; browser vs server enforcement
  design: Policy matrix
  build: Deferred; header and cookie policy
  break: Local cookie or CORS confusion annotation
  verify: Header and cookie tests
  operate: CSP report-only versus enforce
  communicate: Why CSP is not a complete XSS guarantee
masteryGate: '2'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: 5.0.0
  status: final
  requirementIds:
  - V3
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: W3C Content Security Policy Level 3
  version: Level 3
  status: draft
  requirementIds:
  - csp3
  url: https://www.w3.org/TR/CSP3/
- source: W3C Trusted Types
  version: WD
  status: draft
  requirementIds:
  - trusted-types
  url: https://www.w3.org/TR/trusted-types/
misconceptions:
- Origin and site are the same
- CSP or Trusted Types replace context-aware encoding
- Cookies with HTTPS are unreadable to JavaScript
operationalConsiderations:
- CSP reports can leak URLs; treat as potentially sensitive
