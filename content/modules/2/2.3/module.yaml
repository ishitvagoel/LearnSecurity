- date: '2026-09-22'
  note: 'Deepen (D1-D14 remediation): found and fixed the same D12 review-date bug
    already caught on 1.4/2.1/4.3/0.1/0.2/1.1 -- reviewer said "pending independent
    quality and lab-safety review" while lastReviewedAt (2026-08-24) and nextReviewAt
    (2027-02-24) were both set with no review artifact under content/progress/reviews/;
    reverted both to null per metadata-honesty.mdc. Named five falsifiable teaching
    claims (C1-C5) and a coverage contract in spec.md; the module previously taught
    only C1 (HttpOnly) across all eight lessons despite a title and objective
    hierarchy promising CORS, CSP, Trusted Types, and origin/site as first-class
    content. Rewrote all eight lessons to clear the 900-word floor with derivation,
    a worked example, and a counterexample each, added Standards lines to
    01-property.md and 05-verify.md, and replaced the fragment/negation-list prose
    style throughout. Upgraded the lab from Tier 1 (a two-function pure model over
    plain dicts) to Tier 2: a real FastAPI app with /login and /notes, tested
    through fastapi.testclient.TestClient against actual Set-Cookie,
    Access-Control-Allow-Origin/-Credentials, and Content-Security-Policy response
    headers. Reading the existing Tier-1 fixture adversarially before trusting it
    (per this pass''s own instructions) found it asserted only C1 with two tests
    and had no representation of CORS or CSP at all, despite both being named in
    the objective hierarchy and the misconceptions list since Pass A; the rebuilt
    lab now carries 8 tests covering C1, C2, C3, and C4, including an
    origin-vs-site boundary case and an anti-fake case verified against a
    constructed fake fix (an unanchored `origin.endswith("securecollab.example")`
    allow-list check, which passes 6 of 8 tests but fails exactly the anti-fake
    and boundary tests because it also trusts an unrelated lookalike domain and an
    unauthorized sibling subdomain). Verified every ASVS and W3C citation against
    the live canonical sources (ASVS 5.0.0 JSON at the v5.0.0 tag; w3.org/TR pages
    for CSP3 and Trusted Types, both still Working Draft) rather than trusting the
    prior standardsRefs; found the prior OWASP project URL
    (owasp.org/www-project-application-security-verification-standard/) now 404s
    after its redirect chain and replaced it with the live
    owasp.org/projects/asvs, and added v5.0.0-3.4.2 (CORS
    Access-Control-Allow-Origin), v5.0.0-3.4.3 (CSP), and v5.0.0-3.4.6
    (frame-ancestors), none of which this module cited before despite teaching
    all three. Rewrote outcomes as observable behaviors (removing the
    "Demonstrate: <title>" template-fill shape), authored an 8-item
    content/modules/2/2.3/assessment/items.md (none existed; only a rubric did),
    and rewrote the isolated key and rubric to match, deleting the "session
    worksheet" reference. Recomputed estimatedMinutes from the metadata-honesty.mdc
    formula. This pass does not and may not set depth, quality, reviewer beyond
    the pending line above, lastReviewedAt, nextReviewAt, or status: published;
    independent quality and lab-safety review is requested next.'
