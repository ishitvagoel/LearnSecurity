id: '4.3'
slug: sessions-cookies-and-tokens
title: Sessions, cookies, and tokens
phase: 4
track: core
difficulty: intermediate
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 1.1–4.2 Pass A complete
routeTags:
- complete
- web-api
releaseMilestone: M1
outcomes:
- Given a request carrying a candidate session value on the query string, the
  cookie jar, and the Authorization header, identify which channel(s) must be
  rejected outright and justify the rejection by naming the exposure paths
  particular to a URL
- Explain why an identifier that existed before a login event must not be the
  identifier that carries authority after it, and name the attack this closes
- Given a session record's issued-at and last-seen timestamps and a stated
  idle/absolute policy, decide whether the session is still active and name
  which limit, if either, has been exceeded
- Distinguish what a logout request must change at the server from what
  deleting a client-side cookie changes, and name a case where the second
  looks like logout but the first has not happened
- Given a cookie's intended use, choose values for Secure, HttpOnly, and
  SameSite and name the distinct attacker capability each attribute removes
- Transfer the channel, binding, lifetime, and revocation rules to a clinic
  appointment deep link and a one-time magic-link email, and name which rule
  each scenario is still testing
reviewTriggers:
- Material SecureCollab change in this module's concern
- New OAuth or magic-link channel
- Superseding final standard
invariants:
- Claims are properties of SecureCollab (or the elective system), not tool names
- Labs stay in authorized local or official training scope
- Draft standards are labeled draft
- Session tokens must not appear in query strings
- A session identifier present before login must not be the identifier that
  carries authority after login
- A session past its idle or absolute limit is not active regardless of who
  last touched it
threatModelPrompts:
- What can go wrong for this module's assets?
- Which trust boundary or interpreter is in play?
- What residual remains if the primary control fails?
- Who can plant a pre-authentication identifier in a victim's browser before
  the victim logs in?
- Who can still use a token after the browser that received it deletes its
  cookie?
concepts:
- sessions
- securecollab
- seven-step-loop
