labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 4.3-lab
  summary: Session established from a query-string token, or kept alive past its
    absolute lifetime by activity alone
  forbiddenOutcomes:
  - Session established from a query-string token
  - A session's activity alone extends it past its absolute lifetime
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Session protocol/state diagram and theft/replay tests
- Transfer task prompt
- Local lab brief
assessmentBlueprint:
  explain: Causal model for Sessions, cookies, and tokens
  design: Session protocol/state diagram and theft/replay tests
  build: Deferred to Pass B
  break: Authorized local reproduction of the representative failure
  verify: Forbidden-outcome tests
  operate: Detection and recovery notes
  communicate: Residual risk without compliance theater
masteryGate: '4'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-14.2.1
  - v5.0.0-3.4.5
  - v5.0.0-3.3.4
  - v5.0.0-3.3.1
  - v5.0.0-3.3.2
  - v5.0.0-7.2.4
  - v5.0.0-7.3.1
  - v5.0.0-7.3.2
  - v5.0.0-7.4.1
  url: https://owasp.org/www-project-application-security-verification-standard/
misconceptions:
- Query strings are fine over TLS
- JWT means secure
- HttpOnly is the same as not in the URL
- Deleting the cookie client-side is the same as revoking the session at the
  server
- A session that keeps getting used does not need an absolute expiry
operationalConsiderations:
- query_token_rejected; log-redact gateway.
- Magic-link URLs are one-time (6.6), not standing sessions.
- session_expired reason=idle|absolute; revoke-on-logout is a server-side
  write, never only a client-side cookie delete.
