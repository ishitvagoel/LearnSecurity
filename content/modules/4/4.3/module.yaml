- date: '2026-09-17'
  note: 'Deepen (D1-D14 remediation, B0 pilot, third of three): named five teaching
    claims (C1-C5) and a coverage contract in spec.md -- the module previously
    taught only C1 (query-string token) across all eight lessons. Rewrote outcomes
    from the templated "Demonstrate: Sessions, cookies, and tokens" pattern
    (L014) into six observable, assessable behaviours. Expanded all eight lessons
    to clear the 900-word floor with derivation, worked examples, and
    counterexamples rather than padding; added Standards lines to 01-property.md
    and 05-verify.md; restructured 08-review.md as a checklist rather than a
    pre-stated list of findings, applying the lesson from 1.4 and 2.1''s
    independent review. Live-checked all nine ASVS 5.0.0 citations against the
    canonical v5.0.0 tag: the three prior citations (14.2.1, 3.4.5, 3.3.4) were
    accurate but anchored only C1 and one clause of C5; added six V7 (Session
    Management) and V3 (cookie-attribute) identifiers this module needed and
    never cited (7.2.4, 7.3.1, 7.3.2, 7.4.1, 3.3.1, 3.3.2). Read the lab''s
    "fixed" token.py skeptically per upgrade-lab and found it tested only C1;
    added session_is_active(session, now), staging C3''s forbidden outcome (an
    idle-refreshed session that activity alone keeps alive past its absolute
    lifetime) with a normal case, the forbidden-outcome case, an idle-deadline
    boundary case, a fail-closed-on-missing-timestamp case, and a two-test
    anti-fake pair against fresh, never-elsewhere-used timestamps -- raising the
    lab from 3 tests to 9. Authored a nine-item assessment bank with distractor
    rationales and four-state banding in the isolated key; rewrote the rubric to
    remove the non-existent "session worksheet" reference. Corrected the same
    D12 pattern found and fixed on 1.4 and 2.1: reviewer: pending with
    lastReviewedAt/nextReviewAt set to real dates and no artifact under
    content/progress/reviews/; reverted both to null per metadata-honesty.mdc.
    Independent review requested; this pass may not and does not set depth or
    quality.'
