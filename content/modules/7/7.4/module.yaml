outcomes:
- 'Run exports as a named worker principal; leftover user sessions in job payloads are not worker identity.'
- 'Separate HTTP-request subject from service identity; name originating-subject carry-through as an advanced residual.'
- 'Map ASVS 5.0.0 backend service-account requirements and treat NIST SP 800-207 as architecture guidance, not a product.'
reviewTriggers:
- New queue, Celery task, or outbox that inherits request context
- Worker DATABASE_URL or role broader than the job
- Retry/redelivery of jobs after grant revocation (2.4 / 4.1)
- Superseding final standard
invariants:
- A leftover user session is not worker identity
- exporter with user_session alice and no service principal is None
- Labs stay in authorized local or official training scope
- Draft standards are labeled draft
threatModelPrompts:
- What can go wrong when the worker uses the job's user_session as ambient authority?
- Which DB role does the worker actually hold (3.3)?
- What residual remains if retries replay a revoked grant (2.4)?
