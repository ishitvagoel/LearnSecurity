labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 7.4-lab
  summary: User session accepted as worker identity because exporter prefers user_session
  forbiddenOutcomes:
  - User session accepted as worker identity
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- End-to-end authority trace HTTP vs worker
- Transfer task prompt
- Local lab brief with leftover session deny tests
assessmentBlueprint:
  explain: Confused deputy; HTTP subject vs worker principal
  design: Jobs carry service identity; workers authenticate as service
  build: exporter returns worker-sc only in labs/7.4/7.4-lab/fixed
  break: Authorized local user_session or service fallback
  verify: Forbidden-outcome tests plus honest service principal
  operate: worker_identity_wrong without the session cookie
  communicate: Residual originating-subject Level 3, poison loops, god-mode DB role
masteryGate: '7'
