labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 7.2-lab
  summary: Member resolves secret_internal because resolve always returns true
  forbiddenOutcomes:
  - Member resolves secret_internal
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Role times field matrix and serializer tests
- Transfer task prompt
- Local lab brief with member deny on secret_internal
assessmentBlueprint:
  explain: Field grain vs object grain; identifiers are locators
  design: Role times field matrix including GraphQL and CSV
  build: secret_internal only if role is service in labs/7.2/7.2-lab/fixed
  break: Authorized local resolve always true
  verify: Forbidden-outcome tests plus honest display_name
  operate: field_denied without the secret value
  communicate: Residual worker dumps (7.4) and Level 3 immediate grant change
masteryGate: '7'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-8.2.3
  - v5.0.0-8.2.1
  - v5.0.0-8.2.2
  - v5.0.0-8.3.2
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: OWASP API Security Top 10
  version: '2023'
  status: awareness
  requirementIds:
  - API1
  - API3
  - API5
  url: https://owasp.org/API-Security/editions/2023/en/0x00-header/
misconceptions:
- Object-level authz implies field-level
- Private JSON keys are hidden
- GraphQL resolvers inherit REST policy magically
- A UUID is a capability
operationalConsiderations:
- field_denied without the secret value.
- Role change must hide previously visible fields.
- Admin or service sees secret_internal only when audited.
