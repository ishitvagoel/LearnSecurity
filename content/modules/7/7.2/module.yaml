id: '7.2'
slug: object-property-and-function-security
title: Object, property, and function security
phase: 7
track: core
difficulty: intermediate
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 4.4 object-and-tenant grants; 7.1 writable-field writes
routeTags:
- complete
- web-api
releaseMilestone: M2
outcomes:
- 'Refuse field reads that the role cannot resolve; identifiers locate objects, they do not authorize properties.'
- 'Separate object×tenant grants (4.4) from field grain (BOPLA) and from function-level actions.'
- 'Map ASVS 5.0.0 field-level authorization and keep immediate grant-change through serializers as an advanced residual.'
reviewTriggers:
- New serializer, GraphQL field, CSV export, or search snippet that dumps ORM columns
- Role change that must hide previously visible fields
- Bulk update or debug toolbar that bypasses the matrix
- Superseding final standard
invariants:
- A member must not resolve secret_internal
- UUID or object GET success is not a field grant
- Labs stay in authorized local or official training scope
- Draft standards are labeled draft
threatModelPrompts:
- What can go wrong when the serializer dumps the ORM object?
- Which fields are granted on GET /notes/{id} versus on GraphQL resolve?
- What residual remains if the UI hides a column the API still returns?
concepts:
- field-authorization
- bopla
- serializer
- securecollab
- seven-step-loop
