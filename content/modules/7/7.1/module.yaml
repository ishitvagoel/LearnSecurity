labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 7.1-lab
  summary: Client PATCH sets is_admin because the binder copies every key
  forbiddenOutcomes:
  - Client PATCH sets is_admin
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Writable-field matrix and endpoint inventory (not OpenAPI as the control)
- Transfer task prompt
- Local lab brief with is_admin deny tests
assessmentBlueprint:
  explain: Extra keys are not writable fields; binder vs contract
  design: Per-action allow-list across REST, GraphQL, and gRPC
  build: ALLOWED display_name only in labs/7.1/7.1-lab/fixed
  break: Authorized local reproduction of user.update(body)
  verify: Forbidden-outcome tests plus honest display_name
  operate: unknown_field_rejected without the PATCH body
  communicate: Residual unused methods (Level 3) and leftover /v0 routes
masteryGate: '7'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-15.3.3
  - v5.0.0-4.3.2
  - v5.0.0-4.3.1
  - v5.0.0-4.1.4
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: OpenAPI Specification
  version: '3.1.1'
  status: final
  requirementIds:
  - inventory-not-allow-list
  url: https://spec.openapis.org/oas/v3.1.1
- source: OWASP API Security Top 10
  version: '2023'
  status: awareness
  requirementIds:
  - API8
  - API9
  url: https://owasp.org/API-Security/editions/2023/en/0x00-header/
misconceptions:
- If it is not in Swagger it cannot be called
- GraphQL is self-documenting therefore extra mutation args are safe
- Versioning is a security control
- A complete OpenAPI file proves extra keys are ignored
operationalConsiderations:
- unknown_field_rejected; shadow_endpoint_scan.
- Honest display_name XSS (6.2) is another cell.
- Do not log the PATCH document.
