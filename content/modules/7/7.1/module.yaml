id: '7.1'
slug: api-contracts-protocols-and-inventory
title: API contracts, protocols, and inventory
phase: 7
track: core
difficulty: intermediate
status: reviewed
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 6.7 Pass A complete; 1.2 field grain
routeTags:
- complete
- web-api
releaseMilestone: M2
outcomes:
- 'Bind writable API fields as a server allow-list so extra keys cannot change is_admin, billing, or tenant membership.'
- 'Treat OpenAPI as an inventory of endpoints, not as a security control; GraphQL and gRPC are separate contracts with the same extra-field threat.'
- 'Map ASVS 5.0.0 mass-assignment and GraphQL requirements, and keep unused HTTP methods closed as an advanced residual.'
reviewTriggers:
- New PATCH/PUT/GraphQL mutation that binds a document to an entity
- OpenAPI generated from a different source than the running handlers
- GraphQL schema or gRPC proto added without a writable-field matrix
- Superseding final standard
invariants:
- A member PATCH must not set is_admin from the client document
- Extra keys are ignored or rejected; they are not writable fields
- OpenAPI presence is inventory, not the allow-list
- Labs stay in authorized local or official training scope
- Draft standards are labeled draft
threatModelPrompts:
- What can go wrong when the binder maps any JSON key onto the user row?
- Which protocol (REST, GraphQL, gRPC) is missing from the writable-field matrix?
- What residual remains if unused HTTP methods still work after the allow-list?
concepts:
- api
- mass-assignment
- inventory
- securecollab
- seven-step-loop
