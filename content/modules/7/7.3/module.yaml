labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 7.3-lab
  summary: Unsigned webhook body accepted because accept always returns true
  forbiddenOutcomes:
  - Unsigned webhook body accepted
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Signed webhook protocol notes and missing-signature tests
- Transfer task prompt
- Local lab brief with HMAC over raw body
assessmentBlueprint:
  explain: Path hit vs MAC authenticity vs TLS
  design: Raw-body MAC, freshness/replay named, egress named
  build: HMAC-SHA256 compare_digest in labs/7.3/7.3-lab/fixed
  break: Authorized local accept always true
  verify: Forbidden-outcome tests plus matching signature
  operate: webhook_sig_fail without the body or secret
  communicate: Residual parsed-JSON-before-MAC (2.1) and Level 3 per-message signatures
masteryGate: '7'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-11.2.1
  - v5.0.0-2.3.4
  - v5.0.0-2.3.3
  - v5.0.0-4.1.5
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: OWASP API Security Top 10
  version: '2023'
  status: awareness
  requirementIds:
  - API10
  url: https://owasp.org/API-Security/editions/2023/en/0x00-header/
misconceptions:
- TLS to us proves the sender
- IP allow-list is authenticity
- Webhooks are just APIs in reverse so JWT login applies
- Vendor SDK verify is the same as a custom MAC over parsed JSON
operationalConsiderations:
- webhook_sig_fail; replay_window.
- Rotate disposable webhook secrets; never log them.
- Provider compromise — egress plus least privilege on side effects (1.2 / 6.5).
