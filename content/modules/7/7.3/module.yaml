id: '7.3'
slug: webhooks-callbacks-and-third-party-apis
title: Webhooks, callbacks, and third-party APIs
phase: 7
track: core
difficulty: intermediate
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 5.2 MAC vs encoding; 6.5 egress; 2.1 parsers
routeTags:
- complete
- web-api
releaseMilestone: M2
outcomes:
- 'Reject inbound provider callbacks that lack a valid MAC over the raw body; TLS to the path is not authenticity of the message.'
- 'Bind verification to the unparsed bytes; name replay/freshness and outbound URL ownership as residuals.'
- 'Map ASVS 5.0.0 HMAC and replay requirements, and keep per-message signatures as an advanced residual.'
reviewTriggers:
- New inbound webhook or signed callback
- Parser that JSON-loads before the MAC
- Outbound webhook URL supplied by a tenant (6.5)
- Superseding final standard
invariants:
- A missing signature is rejected
- MAC is over raw body bytes, not a re-serialized JSON object
- TLS and IP allow-lists are not message authenticity
- Labs stay in authorized local or official training scope
- Draft standards are labeled draft
threatModelPrompts:
- What can go wrong when any POST to /webhook is trusted?
- What residual remains if the MAC is computed after json.loads?
- What residual remains if a valid signature still triggers an unauthorized side effect (1.2)?
concepts:
- webhooks
- hmac
- authenticity
- securecollab
- seven-step-loop
