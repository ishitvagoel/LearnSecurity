  kind: concept-model
  title: A PDF is not a retest
  path: lessons/01-property.md
- id: 9.5-LO-02
  kind: design-exercise
  title: Same forbidden outcome, same cell
  path: lessons/02-model.md
- id: 9.5-LO-03
  kind: mechanism-lab
