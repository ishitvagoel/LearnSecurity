  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 9.5-lab
  summary: Finding closed without retest
  forbiddenOutcomes:
  - Finding closed without retest
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Assessment report, remediation and variant-search plan, retest record
- Transfer task prompt
- Local lab brief with close-without-retest deny tests
assessmentBlueprint:
  explain: Close requires same-cell retest; CVSS/KEV are inputs
  design: Cause, impact, retest command, variant hunt
  build: close_finding requires retest pass in labs/9.5/9.5-lab/fixed
  break: Authorized local always-true close
  verify: Forbidden-outcome tests plus honest retest pass
  operate: finding_closed_without_retest without bodies
  communicate: Residual variants; CVSS vs business priority; local scope
masteryGate: '9'
