id: '9.5'
slug: penetration-testing-reporting-and-remediation
title: Penetration testing, reporting, and remediation
phase: 9
track: core
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 9.3 test shape; authorized-lab policy
routeTags:
- complete
- web-api
releaseMilestone: null
outcomes:
- 'Refuse closing a finding without a passing retest of the same forbidden outcome; a PDF is not remediation.'
- 'Treat CVSS 4.0 as severity input and CISA KEV as exploitation context, not as the close decision.'
- 'Keep assessment scope local or official; do not instruct live-target pentests.'
reviewTriggers:
- Finding closed without retest
- CVSS offered as the only priority
- Live-target language in learner materials
- No variant search after a root cause
invariants:
- close_finding without retest pass is false
- CVSS is input, not the close predicate
- Labs stay in authorized local or official training scope
- KEV does not authorize public scanning
threatModelPrompts:
- What can go wrong when findings close on intent?
- What residual remains if the retest hits a different endpoint?
- What residual remains after KEV context is applied to an internal-only bug?
concepts:
- same-cell-retest
- cvss-as-input
- authorized-scope
- securecollab
- seven-step-loop
learningObjects:
