- source: OWASP Web Security Testing Guide
  version: '4.2'
  status: final
  requirementIds:
  - WSTG-v42-catalogue
  url: https://owasp.org/www-project-web-security-testing-guide/v42/
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
  - v5.0.0-8.2.1
  - v5.0.0-8.3.2
  url: https://owasp.org/www-project-application-security-verification-standard/
- source: FIRST CVSS
  version: '4.0'
  status: final
  requirementIds:
  - CVSS-4.0
  url: https://www.first.org/cvss/v4.0/specification-document
- source: CISA Known Exploited Vulnerabilities Catalog
  version: 'current-catalog'
  status: awareness
  requirementIds:
  - KEV
  url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
misconceptions:
- A PDF report is remediation
- CVSS 9.8 is the close decision
- KEV listing authorizes scanning public systems
- Jira Done is a retest
operationalConsiderations:
- finding_closed_without_retest.
- Hunt variants of the same root cause.
