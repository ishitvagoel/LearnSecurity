labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 9.2-lab
  summary: eval on user input approved in review
  forbiddenOutcomes:
  - eval on user input approved in review
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Structured review of a seeded change set
- Transfer task prompt
- Local lab brief with eval-deny tests
assessmentBlueprint:
  explain: Visual plausibility is not review; eval on user input is forbidden
  design: Data-flow, authority, state, configuration questions
  build: review_ok rejects eval in labs/9.2/9.2-lab/fixed
  break: Authorized local always-true review_ok
  verify: Forbidden-outcome tests plus honest diff without eval
  operate: review_block_eval without payloads
  communicate: Residual substring stand-in; generated code (E1); 9.4 bots are not oracles
masteryGate: '9'
