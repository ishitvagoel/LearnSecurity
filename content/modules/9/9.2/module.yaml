id: '9.2'
slug: secure-code-review
title: Secure code review
phase: 9
track: core
difficulty: advanced
status: reviewed
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 6.1 interpreter confusion; 9.1 coverage
routeTags:
- complete
- web-api
releaseMilestone: null
outcomes:
- 'Refuse approval of a diff that uses eval on user input; LGTM without interpreters or authority is not review.'
- 'Treat visual plausibility as insufficient; review data flow, authority, state, and configuration.'
- 'Label the lab substring denylist as a stand-in, not a complete review oracle; 9.4 bots are an aid.'
reviewTriggers:
- LGTM on eval of user input
- Reviewer only read the README
- Framework-generated SQL ignored
- AI review offered as a replacement for 9.2
invariants:
- review_ok('x = eval(user)') is false
- Substring denylist is a lab stand-in, not a complete oracle
- Labs stay in authorized local or official training scope
- SSDF 1.2 is labeled draft
threatModelPrompts:
- What can go wrong when visual plausibility is the review?
- What residual remains if the denylist misses exec or SpEL?
- What residual remains if generated code is not reviewed (E1)?
concepts:
- visual-plausibility
- interpreter-review
- ssdf-pw7
- securecollab
- seven-step-loop
