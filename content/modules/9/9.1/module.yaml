outcomes:
- 'Refuse status=done without an isolation assert as coverage of AUTHZ-1.'
- 'Treat ASVS Level 2 as the tailored web/API backbone and label selected Level 3 as advanced, not a wholesale paste.'
- 'Keep SSDF 1.1 as the final practice vocabulary and label SSDF 1.2 IPD as draft; a spreadsheet is not Gate 9.'
reviewTriggers:
