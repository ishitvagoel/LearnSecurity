labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 9.4-lab
  summary: Unmapped HIGH finding allows ship
  forbiddenOutcomes:
  - Unmapped HIGH finding allows ship
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- CI signal design and scanner blind-spot analysis
- Transfer task prompt
- Local lab brief with unmapped-HIGH deny tests
assessmentBlueprint:
  explain: Unmapped HIGH is unowned; scanners are signals
  design: Join findings to 9.1 requirement ids; record reachability
  build: ship_ok requires HIGH ids in the map in labs/9.4/9.4-lab/fixed
  break: Authorized local always-true ship_ok
  verify: Forbidden-outcome tests plus honest mapped HIGH
  operate: unmapped_high_blocks without payloads
  communicate: Residual authz blind spots (9.2/9.3); false positives need owners
