releaseMilestone: null
outcomes:
- 'Refuse shipping an unmapped HIGH finding; mapping to a 9.1 requirement is ownership, not theater.'
- 'Treat SAST/DAST/SCA/secret scanners as signals that still need reachability and human context (9.2).'
- 'Keep GitHub code scanning defaults, SAMM scores, and OpenSSF dashboards from counting as Gate 9.'
reviewTriggers:
- Unmapped HIGH allowed to ship
- Suppression without owner
- SAST offered as Gate 9 evidence
- No blind-spot note for authorization logic
invariants:
- ship_ok of unmapped HIGH is false
- Scanners are signals, not 1.2
- Labs stay in authorized local or official training scope
- SSDF 1.2 is labeled draft
threatModelPrompts:
- What can go wrong when HIGH findings are unmapped?
- What residual remains if every HIGH is mapped but authz is never tested (9.3)?
- What residual remains if reachability is used to drop findings without an owner?
