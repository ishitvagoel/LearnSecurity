  path: lessons/08-review.md
labSpec:
  authorizedScope: Local course fixture or official training lab only; no public or
    third-party targets
  slug: 9.3-lab
  summary: HTTP 200-only test counted as a security test
  forbiddenOutcomes:
  - HTTP 200-only test counted as a security test
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Layered security test portfolio
- Transfer task prompt
- Local lab brief with forbidden-outcome shape tests
assessmentBlueprint:
  explain: Security tests name a forbidden outcome, not only HTTP 200
  design: Happy path vs isolation vs fuzz-without-oracle
  build: is_security_test requires forbidden_outcome in labs/9.3/9.3-lab/fixed
  break: Authorized local status-only counted as security
  verify: Forbidden-outcome tests plus honest named-forbidden row
  operate: security_suite_missing_isolation without bodies
  communicate: Residual exploratory 9.5; fuzzing without an oracle
masteryGate: '9'
