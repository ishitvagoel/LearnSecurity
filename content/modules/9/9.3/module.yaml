id: '9.3'
slug: security-focused-tests
title: Security-focused tests
phase: 9
track: core
difficulty: advanced
status: draft
estimatedMinutes: 240
prerequisites:
- Prior phase Pass A per blueprint §7; 1.2 isolation; 9.1 coverage; 9.2 review
routeTags:
- complete
- web-api
releaseMilestone: null
outcomes:
- 'Refuse HTTP 200-only tests as security tests; a security test names a forbidden outcome.'
- 'Treat ASVS, WSTG 4.2, and MASTG 2.0 as catalogues of what to test, not as the definition of test shape.'
- 'Keep pytest-cov and lint membership from counting as 1.2; label fuzzing without an oracle as residual (9.5).'
reviewTriggers:
- Suite that only asserts HTTP 200
- WSTG checklist membership offered as a passing test
- Fuzzing without an oracle offered as AUTHZ-1 evidence
- Gate 9 claimed from coverage percentage
invariants:
- is_security_test with only status_asserted is false
- A security test names a forbidden outcome
- Labs stay in authorized local or official training scope
- SSDF 1.2 and WSTG 5.0 are labeled draft if cited
threatModelPrompts:
- What can go wrong when the suite only asserts HTTP 200?
- What residual remains if fuzzing has no oracle?
- What residual remains after a well-shaped isolation test (9.5)?
concepts:
- forbidden-outcome
- happy-path-false-assurance
- test-shape
- securecollab
- seven-step-loop
