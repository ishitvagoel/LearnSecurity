id: '3.1'
slug: assets-data-classification-and-security-requirements
title: Assets, data classification, and security requirements
phase: 3
track: core
difficulty: intermediate
status: published
estimatedMinutes: 330
prerequisites:
- Blueprint §7; 1.1-2.4 authored (asset/authority/boundary models; the Phase 2 browser-edge-API-database
  request path)
routeTags:
- complete
- web-api
releaseMilestone: null
outcomes:
- Given a field and a candidate sink, decide allow or deny for that field-sink pair
  and name the classification level and the check that produced the decision.
- Identify every authority artifact an inventory limited to content fields would
  omit, and justify classifying each at least as sensitively as the content it gates.
- Write a requirements-backlog entry for a classified field naming the sink, the
  allow/deny decision, and the failure behavior when a field's status is unknown,
  and explain why a level alone is insufficient.
- Given a newly added, unclassified field, predict how each existing sink treats
  it by default and explain why that default is a decision already made, not a
  delay.
- Design a detection signal and a purge/rotation response for a redaction miss,
  and explain why a fix at one call site does not cover a second, independently-reached
  sink.
reviewTriggers:
- A new SecureCollab field, sink, or third-party integration this inventory does
  not yet name
- A company boundary change that changes which parties count as untrusted for a
  given field
- Superseding final standard
invariants:
- A classification level is not a control until a named sink enforces it and a test
  proves the enforcement holds
- An authority artifact (session token, API key) is classified at least as sensitively
  as the content it gates
- An unclassified field defaults to the most restrictive level, not the least
- Labs stay in authorized local or official training scope
- Draft standards are labeled draft
threatModelPrompts:
- What must remain true if a brand-new field is added to the schema tomorrow and
  nobody remembers to classify it?
- What fails if a sink is reached by a code path other than the one that was fixed?
- What can go wrong for the note body and the session token specifically, as two
  distinct assets with two distinct blast radii?
