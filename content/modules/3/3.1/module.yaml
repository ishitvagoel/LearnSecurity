labSpec:
  authorizedScope: Local course fixture only; no public or third-party targets
  slug: 3.1-lab
  summary: A note body and a session token both reach an application log and a
    second, independent error-dump sink, because neither sink consults the classification
    table sitting next to it
  forbiddenOutcomes:
  - Confidential note body appears in the application log
  - Session token (an authority artifact) appears in the application log or the
    error dump
  - An unclassified field is allowed by default rather than denied by default
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Data inventory, classification table, and security-requirements backlog
- Transfer task prompt
- Local lab brief
assessmentBlueprint:
  explain: Causal model for why a classification level is not itself a control,
    and why an inventory limited to content fields is incomplete
  design: Data inventory, classification table, security-requirements backlog
  build: Per-sink allow-list with a fail-safe default for unclassified fields
  break: Authorized local reproduction of the representative failure (two independent
    sinks, neither consulting the classification table)
  verify: Forbidden-outcome, boundary, malformed/failure, and anti-fake tests
  operate: Redaction-miss detection and purge/rotation recovery notes
  communicate: Residual risk (unclassified future fields, sinks outside this mechanism)
    without compliance theater
masteryGate: '3'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
