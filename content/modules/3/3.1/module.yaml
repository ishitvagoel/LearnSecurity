  - v5.0.0-14.1.2
  - v5.0.0-14.2.3
  - v5.0.0-14.2.4
  - v5.0.0-16.1.1
  - v5.0.0-16.2.5
  url: https://owasp.org/projects/asvs
- source: NIST Cybersecurity Framework (CSF) 2.0
  version: '2.0'
  status: final
  requirementIds:
  - Identify
  url: https://www.nist.gov/publications/nist-cybersecurity-framework-csf-20
misconceptions:
- A classification label (a spreadsheet cell, a Confluence tag, a privacy-policy
  sentence) is itself a security control
- An inventory that lists content fields is complete without also listing the authority
  artifacts that grant broader access than the content they gate
- A field nobody has classified yet is low-risk until proven otherwise
- Logs are internal, so anything in them is safe
- A privacy policy equals redaction
operationalConsiderations:
- log_redaction_miss alerts on a sink emitting a field whose level its own policy
  does not allow; purge matching records; rotate any token that was exposed; never
  re-emit the value while investigating it.
- Operators still legitimately see Internal fields (note id, company id) in the
  same log line. That's a different backlog row - document it, do not treat it
  as evidence the Confidential fields are also safe.
