id: '3.2'
slug: threat-modeling
title: Threat modeling
phase: 3
track: core
difficulty: intermediate
status: draft
estimatedMinutes: 330
prerequisites:
- Blueprint §7; 1.1-3.1 authored (SecureCollab's authority model, trust boundaries,
  and Phase 3 asset/classification inventory)
routeTags:
- complete
- web-api
releaseMilestone: null
outcomes:
- Given a submitted SecureCollab threat-model document and a scanner result, decide
  whether the CI merge gate should pass or fail, and name which check (mandatory-id
  presence, owner/trigger, flow coverage, priority/mitigation, or trigger re-review)
  failed.
- Given a data-flow diagram with one required flow missing, identify which always-name
  threat's coverage claim becomes unchecked and explain why the threat id alone
  was not sufficient evidence.
- Given a prioritized threat list whose top-priority row has a placeholder mitigation,
  explain why ranking the threats did not yet produce an actionable decision, and
  write a real one.
- Given a named review trigger that has fired, decide whether a specific threat
  row's re-review record satisfies it independent of any self-reported update date,
  and design the detection signal for a row that does not.
- 'Transfer: rewrite the always-name set, the required-flow list, and one prioritized
  mitigation for clinic SMS reminders, a channel no HTTP scanner enumerates, without
  using a Top 10 or a vendor questionnaire as the definition of security.'
reviewTriggers:
- New share path, worker identity, webhook, SMS/email channel, or client surface
- A change to SecureCollab's Phase 3 asset or classification inventory in 3.1
- Superseding final standard (SP 800-154 finalized, or an ASVS revision that restores
  or relocates architecture-documentation requirements)
invariants:
- A green scanner result cannot substitute for the versioned model's always-name
  set, owners, and review triggers
- A threat id present in the model is not evidence of coverage until the diagram's
  declared flows trace the path that threat depends on
- A priority ranking with no real mitigation on the top row has not produced a
  decision
- Staleness is measured by what was actually re-reviewed after a named trigger
  fired, never by a self-reported "last updated" date
- Labs stay in authorized local or official training scope
- Draft standards are labeled draft
threatModelPrompts:
- What can go wrong for SecureCollab's Phase 3 notes, share grants, and session
  cookies specifically, as distinct assets with distinct blast radii?
- Which trust boundary or worker path is missing from the diagram, and what does
  that omission let through even when every listed threat id is present?
- What residual remains if the gate's checks all pass but the human who wrote
  revisited_after never actually reopened the four questions?
