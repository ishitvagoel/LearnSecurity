labSpec:
  authorizedScope: Local course fixture only; no public or third-party targets
  slug: 3.2-lab
  summary: A stored threat-model document reaches SecureCollab's CI merge gate,
    which reads only the scanner's green/red result and never opens the document
    itself
  forbiddenOutcomes:
  - A green scanner result passes the gate for a model missing cross-tenant-read,
    hostile-browser, or stolen-worker
  - A mandatory threat id passes the gate with no owner or review trigger
  - A required flow (worker-share-redelivery) is untraced while the gate still
    passes
  - The top-priority threat's mitigation is a placeholder and the gate still passes
  - A fired review trigger's threat row is not recorded as revisited and the gate
    still passes
  - Live-target instructions
  - Real PII or production secrets
  - Awareness list used as the syllabus
evidenceRequired:
- Version-controlled threat model with owners, priorities, and review triggers
- Transfer task prompt
- Local lab brief
assessmentBlueprint:
  explain: Causal model for why a green scanner is coverage, not a model, and why
    a threat id with no traced flow is a label
  design: Version-controlled threat model with prioritized, traceable rows
  build: A CI gate that checks presence, flow coverage, prioritized mitigation,
    and trigger-based re-review, independent of scanner state
  break: Authorized local reproduction of the representative failure (a gate that
    reads only scanner_green)
  verify: Forbidden-outcome, boundary, malformed/failure, and anti-fake tests
  operate: Missing/stale-threat detection and non-back-dated recovery notes
  communicate: Residual risk (facilitation quality, honest re-review) without
    compliance theater
masteryGate: '3'
standardsRefs:
- source: OWASP Application Security Verification Standard
  version: '5.0.0'
  status: final
  requirementIds:
