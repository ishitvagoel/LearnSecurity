  - v5.0.0-15.1.4
  - v5.0.0-15.1.5
  url: https://owasp.org/projects/asvs
- source: OWASP Threat Modeling Project
  version: maintained-project-guidance
  status: final
  requirementIds:
  - four-questions
  url: https://owasp.org/projects/threat-modeling-project
- source: NIST SP 800-154
  version: IPD
  status: draft
  requirementIds:
  - data-centric-threat-modeling
  url: https://csrc.nist.gov/pubs/sp/800/154/ipd
misconceptions:
- Green scan means no threats
- Threat models are pre-code only and are never re-checked
- STRIDE stickers without owners, priorities, or a falsification test are a model
- Prioritizing threats is the same as deciding what to build
- Awareness lists are the threat list
operationalConsiderations:
- missing_mandatory_threat with a reason code (not_present, no_owner, no_trigger,
  not_revisited) and the threat id; never the note body or session token.
  model_age_days tracked after a named trigger fires.
- Recovery adds the missing row, owner, or mitigation and records the revisit;
  it never rewrites a "last updated" date to make a stale row look current.
